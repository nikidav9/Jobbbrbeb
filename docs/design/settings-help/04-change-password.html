<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JT — Сменить пароль</title>
<link rel="stylesheet" href="assets/jt.css">
</head>
<body>
<div class="screen">
<div class="page" aria-hidden="true">
  <div class="hdr hdr--center">
    <span class="btn-round"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></span>
    <h1 class="h-title">Настройки</h1>
  </div>
  <h2 class="section-label" style="margin-top:28px">Аккаунт</h2>
  <div class="card" style="height:196px"></div>
</div>
<div class="overlay"></div>

<div class="sheet" role="dialog" aria-label="Сменить пароль">
  <span class="handle"></span>
  <div style="margin-top:16px;display:flex;align-items:center;gap:12px">
    <span class="tile tile--accent" style="width:44px;height:44px;border-radius:13px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/></svg></span>
    <h2 class="title-u" style="flex-grow:1;font-size:19px">Сменить пароль</h2>
    <button class="btn-round" aria-label="Закрыть" style="width:40px;height:40px;border:1.5px solid #CFC4B6"><svg data-icon="close" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div style="margin-top:20px;display:flex;flex-direction:column;gap:16px">
    <label class="field"><span class="label">Текущий пароль</span>
      <span class="input input--focus"><input type="password" value="password1" aria-label="Текущий пароль"><button class="eye" aria-label="Показать пароль"><svg data-icon="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7s10 7 10 7s-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
    </label>
    <label class="field"><span class="label">Новый пароль</span>
      <span class="input"><input type="password" placeholder="Минимум 8 символов" aria-label="Новый пароль"><button class="eye" aria-label="Показать пароль"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B645C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7s10 7 10 7s-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
    </label>
    <label class="field"><span class="label">Повторите новый пароль</span>
      <span class="input"><input type="password" placeholder="Ещё раз" aria-label="Повторите новый пароль"><button class="eye" aria-label="Показать пароль"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B645C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7s10 7 10 7s-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
    </label>
  </div>

  <a href="#" class="link" style="margin-top:18px;align-self:center;font-size:14px">Нет пароля? Задайте его по коду из письма</a>

  <button class="btn btn--disabled" style="margin-top:20px" disabled>Сохранить</button>
  <button class="btn btn--ghost" style="margin-top:4px">Отмена</button>
</div>
</div>
</body>
</html>
