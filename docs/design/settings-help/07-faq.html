<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JT — Частые вопросы</title>
<link rel="stylesheet" href="assets/jt.css">
</head>
<body>
<div class="screen">
<div class="page" aria-hidden="true">
  <div class="hdr">
    <span class="btn-round"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></span>
    <h1 class="h-title">Помощь</h1>
  </div>
</div>
<div class="overlay"></div>

<div class="sheet sheet--bg" role="dialog" aria-label="Частые вопросы" style="top:118px">
  <span class="handle"></span>
  <div style="margin-top:16px;display:flex;align-items:center;gap:12px">
    <h2 class="title-u" style="flex-grow:1;font-size:21px">Частые вопросы</h2>
    <button class="btn-round" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div class="faq" style="margin-top:18px">
    <div class="faq__item faq__item--open">
      <button class="faq__q" aria-expanded="true">Как связаться с оператором?<svg data-icon="chevron-up" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 15l6-6l6 6"/></svg></button>
      <p class="faq__a">Нажмите «Позвать оператора» в чате поддержки. Диалог сразу появится у поддержки, и оператор ответит прямо сюда.</p>
    </div>
    <div class="faq__item"><button class="faq__q" aria-expanded="false">Что делать, если просят деньги, код из SMS или данные карты?<svg data-icon="chevron-down" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 9l6 6l6-6"/></svg></button></div>
    <div class="faq__item"><button class="faq__q" aria-expanded="false">Как загрузить или заменить резюме?<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 9l6 6l6-6"/></svg></button></div>
    <div class="faq__item"><button class="faq__q" aria-expanded="false">Как получить свежую версию приложения?<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 9l6 6l6-6"/></svg></button></div>
    <div class="faq__item"><button class="faq__q" aria-expanded="false">Почему не приходят уведомления?<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 9l6 6l6-6"/></svg></button></div>
    <div class="faq__item"><button class="faq__q" aria-expanded="false">Где посмотреть статус отклика?<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 9l6 6l6-6"/></svg></button></div>
    <div class="faq__item"><button class="faq__q" aria-expanded="false">Как откликнуться на вакансию?<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 9l6 6l6-6"/></svg></button></div>
  </div>
</div>
</div>
</body>
</html>
