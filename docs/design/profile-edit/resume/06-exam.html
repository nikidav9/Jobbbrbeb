<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job2 — Экзамен или тест</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  /* Экран под ширину 390 (iPhone 14/15). Тёмный фон вокруг — только для просмотра в браузере. */
  html,body{margin:0}
  body{background:#2B2926;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif}
  .screen{border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  a{color:#141414} a:hover{color:#C2410C}
  input::placeholder,textarea::placeholder{color:#9A9086}
</style>
</head>
<body>
<div class="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #F5EFE6; color: #141414; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 14px; height: 44px">
<a href="#" aria-label="Назад в профиль" style="flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 2px solid #141414; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
<h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Экзамен или тест</h1>
</div>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.45; font-weight: 600; color: #6B645C">Например, IELTS, TOEFL или тестирование от компании</p>

<div style="margin-top: 22px; display: flex; flex-direction: column; gap: 20px">
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Название</span>
<input placeholder="IELTS Academic" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 2px solid #141414; box-shadow: 3px 3px 0 #FF6B1A; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; color: #141414; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Кто проводил</span>
<input placeholder="Организация" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; color: #141414; outline: none">
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Год</span>
<button style="height: 56px; box-sizing: border-box; padding: 0 12px 0 16px; border-radius: 16px; border: 1.5px solid #CFC4B6; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; color: #9A9086; cursor: pointer">Выбрать<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6-6"/></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Результат</span>
<input placeholder="7.0" style="height: 56px; min-width: 0; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; color: #141414; outline: none">
</label>
</div>
</div>
</div>
<button style="position: absolute; left: 20px; right: 20px; bottom: 32px; height: 60px; border-radius: 30px; border: 2px solid #141414; background: #FF6B1A; box-shadow: 4px 4px 0 #141414; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: #141414; cursor: pointer">Добавить</button>
</div>
</div>
</body>
</html>
