<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job2 — Образование</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  /* Экран под ширину 390 (iPhone 14/15). Тёмный фон вокруг — только для просмотра в браузере. */
  html,body{margin:0}
  body{background:#2B2926;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif}
  .screen{border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  a{color:#141414} a:hover{color:#C2410C}
  input::placeholder,textarea::placeholder{color:#9A9086}
</style>
</head>
<body>
<div class="screen">
<div style="width: 390px; height: 1000px; box-sizing: border-box; position: relative; background: #F5EFE6; color: #141414; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 14px; height: 44px">
<a href="#" aria-label="Назад в профиль" style="flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 2px solid #141414; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
<h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Образование</h1>
</div>

<div style="margin-top: 24px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Уровень</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 2px solid #141414; background: #FF6B1A; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 15px; color: #141414">Среднее</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Среднее специальное</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Неоконченное высшее</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Бакалавр</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Специалист</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Магистр</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Кандидат наук</button>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Учебное заведение</span>
<input placeholder="Школа, колледж или вуз" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; color: #141414; outline: none">
</label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Год окончания</span>
<button style="height: 56px; box-sizing: border-box; padding: 0 14px 0 16px; border-radius: 16px; border: 1.5px solid #CFC4B6; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; color: #9A9086; cursor: pointer">Выбрать год<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6-6"/></svg></button>
</div>

<div style="display: flex; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B645C" stroke-width="2.2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
<span style="font-size: 13px; line-height: 1.45; font-weight: 600; color: #4A443D">Для среднего специального и высшего появятся поля «Факультет» и «Специальность»</span>
</div>

<button style="height: 56px; border-radius: 18px; border: 2px dashed #141414; background: transparent; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 16px; color: #141414; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить ещё учебное заведение</button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(rgba(245,239,230,0), #F5EFE6 50%)"></div>
<button style="position: absolute; left: 20px; right: 20px; bottom: 32px; height: 60px; border-radius: 30px; border: 2px solid #141414; background: #FF6B1A; box-shadow: 4px 4px 0 #141414; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: #141414; cursor: pointer">Сохранить</button>
</div>
</div>
</body>
</html>
