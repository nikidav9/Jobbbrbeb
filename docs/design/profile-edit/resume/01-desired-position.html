<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Job2 — Желаемая должность</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  /* Экран под ширину 390 (iPhone 14/15). Тёмный фон вокруг — только для просмотра в браузере. */
  html,body{margin:0}
  body{background:#2B2926;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif}

<body>
<div class="screen">

<div style="padding: 56px 20px 0; display: flex; flex-direction: column">

<h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap">Желаемая должность</h1>
</div>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.45; font-weight: 600; color: #6B645C">Работодатели видят это первым в вашем резюме</p>

<div style="margin-top: 22px; display: flex; flex-direction: column; gap: 22px">

</label>

<span style="font-size: 14px; font-weight: 700; color: #4A443D">Зарплата</span>

<input value="140 000" inputmode="numeric" aria-label="Зарплата" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; color: #141414">
<span style="font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700">₽</span>
</label>
<div style="display: flex; gap: 8px">
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 2px solid #141414; background: #FF6B1A; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 14px; color: #141414">На руки</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px; color: #141414">До вычета налогов</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Проектная</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Стажировка</button>

</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">В офисе</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Гибрид</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 2px solid #141414; background: #FF6B1A; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 15px; color: #141414">Удалённо</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Город</span>
<a href="../personal/15-city-metro.html" style="height: 56px; box-sizing: border-box; padding: 0 14px 0 16px; border-radius: 16px; border: 2px solid #141414; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #141414; font-size: 16px; font-weight: 700">Москва<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"/></svg></a>
</div>

<div style="display: flex; gap: 10px; padding: 14px; border-radius: 16px; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B645C" stroke-width="2.2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
<span style="font-size: 13px; line-height: 1.45; font-weight: 600; color: #4A443D">Опыт работы считается автоматически по местам работы — отдельно указывать не нужно</span>
</div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(rgba(245,239,230,0), #F5EFE6 50%)"></div>
<button style="position: absolute; left: 20px; right: 20px; bottom: 32px; height: 60px; border-radius: 30px; border: 2px solid #141414; background: #FF6B1A; box-shadow: 4px 4px 0 #141414; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: #141414; cursor: pointer">Сохранить</button>
