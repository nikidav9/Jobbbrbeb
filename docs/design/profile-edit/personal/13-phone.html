<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job2 — Телефон</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  /* Экран под ширину 390 (iPhone 14/15). Тёмный фон вокруг — только для просмотра в браузере. */
  html,body{margin:0}
  body{background:#2B2926;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif}
  .screen{border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  a{color:#141414} a:hover{color:#C2410C}
  input::placeholder,textarea::placeholder{color:#9A9086}
</style>
</head>
<body>
<div class="screen">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #F5EFE6; color: #141414; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden">
<div style="padding: 70px 20px 0; display: flex; flex-direction: column; gap: 14px" aria-hidden="true">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #6B645C">КОНТАКТЫ</span>
<div style="height: 250px; border-radius: 22px; background: #FFFFFF"></div>
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #6B645C">РАЗРЕШЕНИЕ НА РАБОТУ</span>
<div style="height: 170px; border-radius: 22px; background: #FFFFFF"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(20,20,20,0.5)"></div>

<div role="dialog" aria-label="Телефон" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 34px; border-radius: 28px 28px 0 0; background: #FFFFFF; border-top: 2px solid #141414; display: flex; flex-direction: column">
<span style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #CFC4B6"></span>
<div style="margin-top: 16px; display: flex; align-items: center; gap: 12px">
<span style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 13px; background: #FFE2CC; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>
<h2 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 19px">Телефон</h2>
<button aria-label="Закрыть" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div style="margin-top: 20px; display: flex; gap: 10px">
<button aria-label="Код страны" style="flex-shrink: 0; height: 56px; padding: 0 12px 0 14px; border-radius: 16px; border: 2px solid #141414; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 800; color: #141414; cursor: pointer">+7<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6-6"/></svg></button>
<input type="tel" value="999 000-00-00" aria-label="Номер телефона" style="flex-grow: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 2px solid #141414; box-shadow: 3px 3px 0 #FF6B1A; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-size: 17px; font-weight: 700; color: #141414; outline: none">
</div>
<label style="margin-top: 16px; display: flex; align-items: center; gap: 10px; cursor: pointer">
<span style="flex-shrink: 0; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; border: 2px solid #141414; background: #FF6B1A; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l9-10"/></svg></span>
<span style="font-size: 15px; font-weight: 700">Показывать номер работодателям</span>
</label>
<p style="margin: 14px 0 0; font-size: 13px; line-height: 1.45; font-weight: 600; color: #6B645C">Пришлём SMS с кодом, чтобы подтвердить новый номер</p>
<button style="margin-top: 20px; height: 58px; border-radius: 29px; border: 2px solid #141414; background: #FF6B1A; box-shadow: 4px 4px 0 #141414; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: #141414; cursor: pointer">Получить код</button>
</div>
</div>
</div>
</body>
</html>
