<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job2 — Переезд</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  /* Экран под ширину 390 (iPhone 14/15). Тёмный фон вокруг — только для просмотра в браузере. */
  html,body{margin:0}
  body{background:#2B2926;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box;font-family:'Manrope',system-ui,sans-serif}
  .screen{border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  a{color:#141414} a:hover{color:#C2410C}
  input::placeholder,textarea::placeholder{color:#9A9086}
</style>
</head>
<body>
<div class="screen">
<div style="width: 390px; height: 900px; box-sizing: border-box; position: relative; background: #F5EFE6; color: #141414; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden">
<div style="padding: 56px 20px 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 14px; height: 44px">
<a href="#" aria-label="Назад в профиль" style="flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 2px solid #141414; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6l6 6"/></svg></a>
<h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em">Переезд</h1>
</div>
<p style="margin: 10px 0 0; font-size: 14px; line-height: 1.45; font-weight: 600; color: #6B645C">Готовы ли вы переехать ради работы</p>

<div style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px" role="radiogroup" aria-label="Готовность к переезду">
<label style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #E3D9CC; cursor: pointer">
<span style="flex-shrink: 0; width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid #141414; background: #FFFFFF"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Не готов к переезду</span><span style="font-size: 13px; font-weight: 600; color: #6B645C">Ищу работу только в своём городе</span></span>
</label>
<label style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 2px solid #141414; box-shadow: 4px 4px 0 #141414; cursor: pointer">
<span style="flex-shrink: 0; width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid #141414; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: #FF6B1A"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Готов к переезду</span><span style="font-size: 13px; font-weight: 600; color: #6B645C">Рассмотрю предложения из других городов</span></span>
</label>
<label style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid #E3D9CC; cursor: pointer">
<span style="flex-shrink: 0; width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid #141414; background: #FFFFFF"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Хочу переехать</span><span style="font-size: 13px; font-weight: 600; color: #6B645C">Ищу работу именно в другом городе</span></span>
</label>
</div>

<div style="margin-top: 26px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700; color: #4A443D">Куда готовы переехать</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 2px solid #141414; background: #FF6B1A; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 15px; color: #141414">Любой город</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Санкт-Петербург</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Казань</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Екатеринбург</button>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #CFC4B6; background: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414">Новосибирск</button>
<button style="height: 40px; padding: 0 16px 0 12px; border-radius: 20px; border: 1.5px dashed #6B645C; background: transparent; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; color: #141414; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Другой город</button>
</div>
</div>
</div>
<button style="position: absolute; left: 20px; right: 20px; bottom: 32px; height: 60px; border-radius: 30px; border: 2px solid #141414; background: #FF6B1A; box-shadow: 4px 4px 0 #141414; font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: #141414; cursor: pointer">Сохранить</button>
</div>
</div>
</body>
</html>
