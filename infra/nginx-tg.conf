# tg.jobtoo.ru — отдельное имя только для вебхука Телеграма.
#
# Зачем оно нужно. Телеграм не дозванивается до нашего IPv4: с сервера
# наружу по IPv4 к api.telegram.org тоже 0 из 2, по IPv6 — 4 из 4. Прямой
# вебхук на jobtoo.ru упал с «Connection timed out», и обновления пришлось
# временно гонять через внешний relay. У jobtoo.ru есть и A, и AAAA, а Телеграм выбирает
# сам — и выбирает, судя по всему, сломанный путь.
#
# Поэтому имя без A-записи: только AAAA. Выбора у Телеграма не остаётся,
# он идёт по IPv6, который заведомо работает в обе стороны.
#
# Больше это имя не умеет ничего: один-единственный /api/tg.php. Всё
# остальное — 404, чтобы новое публичное имя не открыло второй вход в
# сайт, в базу и в хранилище.

server {
    listen 80;
    listen [::]:80;
    server_name tg.jobtoo.ru;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://tg.jobtoo.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tg.jobtoo.ru;

    ssl_certificate     /etc/letsencrypt/live/tg.jobtoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.jobtoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location = /api/tg.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/tg.php;
        fastcgi_param SCRIPT_NAME /api/tg.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location / { return 404; }
}
