# Supabase на своём сервере — то, что раньше было облачным.
#
# Из тринадцати служб официальной сборки здесь семь. Выброшены:
#   auth (gotrue)  — у нас свой вход, bcrypt в php-proxy/db.php
#   studio, meta   — панель не нужна, у нас свой дашборд
#   edge-runtime   — единственную функцию push-notify перепишем на PHP
#   supavisor      — пул соединений при нашей нагрузке лишний
# Меньше служб — меньше памяти и меньше того, что может сломаться.
#
# Шлюзом вместо Envoy работает nginx на самой машине: он и так нужен для
# сертификата, а его конфигурацию я могу прочитать и починить, в отличие от
# сгенерированной Envoy. Наружу контейнеры не смотрят — только на 127.0.0.1.

name: jobtoo

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      # Realtime читает журнал репликации — без logical он не работает вовсе.
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      # 4 ГБ памяти на всех: Postgres берёт четверть, остальное службам и кэшу.
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Главное: весь доступ к данным идёт через него. Это тот самый /rest/v1,
  # который дёргают php-proxy и дашборд.
  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  # Живые обновления чатов, лайков и уведомлений — двенадцать подписок
  # в contexts/AppContext.tsx. Самая капризная часть: держит слот репликации,
  # и если тот отвалится, всё остальное продолжит работать как ни в чём не
  # бывало, а чаты тихо перестанут обновляться. Поэтому за ним отдельный присмотр.
  realtime:
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:4000:4000"]
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      # Своя роль вместо суперпользователя. По умолчанию здесь по-прежнему
      # supabase_admin: переменную выставляет bootstrap и только после того,
      # как убедится, что роль заведена и служба на ней поднялась. Если не
      # поднялась — он же возвращает значение обратно. Так правка не может
      # оставить чаты без живого обновления дольше одного захода.
      DB_USER: ${REALTIME_DB_USER:-supabase_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      # Без него Realtime падает при старте на System.fetch_env! — переменная
      # обязательная, хотя метрики нам и не нужны.
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DISABLE_HEALTHCHECK_LOGGING: "true"
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  # Аватары, фотографии и голосовые из чатов. Файлы кладём на диск сервера;
  # если разрастутся — переедут в объектное хранилище Timeweb.
  storage:
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:5000:5000"]
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # Под владельцем своей схемы, а не под суперпользователем.
      #
      # Сначала было наоборот: собственные миграции Storage не проходили без
      # полных прав и служба падала на старте с DatabaseError. Контейнер при
      # этом значился работающим, а шлюз отдавал 502 — «файлы не грузятся»
      # без объяснений. Тогда это решили силой и записали как временное.
      #
      # Теперь силы не нужно: миграции применены однажды и повторно ничего
      # не создают, а на каждый день службе хватает прав владельца схемы.
      # Суперпользователь же означал, что дыра в обработке загруженного
      # файла открывала бы всю базу целиком, а не только хранилище.
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: jobtoo
      REGION: msk
      GLOBAL_S3_BUCKET: jobtoo
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: ${SERVICE_ROLE_KEY}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${JWT_SECRET}
    volumes:
      - storage-data:/var/lib/storage

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    # Приоритет для OOM-killer. На 4 ГБ без лимитов ядро при всплеске убивало
    # самый крупный процесс — а это часто сам Postgres, и тогда разом ложились
    # и сайт, и дашборд. Положительное значение делает контейнер «первым в
    # очереди на убийство»: под давлением ядро возьмёт imgproxy/studio/дашборд,
    # а базу не тронет. Сам imgproxy без состояния и поднимется сам.
    oom_score_adj: 500
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage-data:/var/lib/storage

  # Панель для просмотра базы — та же, что в облачном Supabase.
  # Наружу сама не смотрит: доступ через nginx, за паролем и сертификатом.
  meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    # Некритичный (нужен только studio) — жертвуем им раньше базы. См. imgproxy.
    oom_score_adj: 700
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      # Studio — смотрелка: роль читает всё и не меняет ничего. Правки схемы
      # идут миграциями из репозитория, а не мышкой в браузере.
      PG_META_DB_USER: ${META_DB_USER:-supabase_admin}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    depends_on: [meta]
    ports: ["127.0.0.1:3001:3000"]
    # Смотрелка базы, а не боевой путь: под давлением памяти отдаём её первой
    # (кроме дашборда). Открывается редко, поднимется сама. См. imgproxy.
    oom_score_adj: 800
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: JobToo
      DEFAULT_PROJECT_NAME: JobToo
      SUPABASE_URL: http://rest:3000
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: "false"

  # PHP-прокси — тот же, что сейчас крутится на Reg.ru.
  #
  # Он появился когда-то потому, что Supabase был недоступен из России
  # напрямую. Эта причина отпала: бэкенд теперь в Москве. Но выбрасывать
  # прокси нельзя — за годы он оброс делом: вход по паролю с bcrypt,
  # телеграм-бот, рассылки, ночные задачи. И главное, он прячет сервисный
  # ключ: пойди приложение в базу напрямую, ключ оказался бы в каждом
  # телефоне, а с ним полный доступ ко всем данным.
  #
  # Поэтому не удаляем, а переносим сюда. Тогда запрос идёт
  # «приложение → этот сервер», без лишнего прыжка через Reg.ru.
  #
  # Сеть — хозяйская, а не докерная. Причина конкретная: api.telegram.org
  # доступен с этой машины только по IPv6, его IPv4-адрес закрыт наглухо.
  # Замерено: с машины ipv6 3 попытки из 4, ipv4 — 0 из 4; из контейнера,
  # где IPv6 нет вовсе, 0 из 8, включая принудительный IPv4. При этом
  # ya.ru и GitHub из контейнера открывались — то есть закрыт именно
  # Telegram по IPv4, а не сеть вообще.
  #
  # Выбор из двух: раздать IPv6 всей докерной сети или отдать одному этому
  # контейнеру стек машины. Второе меняет меньше: перезапускается прокси,
  # а не база со всеми связями. Заодно чинит и остальные исходящие —
  # Expo Push, геокодер.
  #
  # Раз сеть общая, php-fpm обязан слушать только 127.0.0.1: иначе порт
  # 9000 окажется открыт наружу. Настройка лежит файлом, а не в надежде
  # на файрвол.
  # Образ не alpine намеренно. Его библиотека не расставляет адреса по
  # приоритету так, как это делает система на самой машине: из четырёх
  # обращений к Telegram проходили два — половина уходила в закрытый IPv4
  # и умирала по тайм-ауту. С машины при этом брало четыре из четырёх.
  # Обычный образ ведёт себя как машина и чинит все места разом, вместо
  # правки двадцати одного вызова curl по отдельности.
  php:
    image: php:8.3-fpm
    restart: unless-stopped
    network_mode: host
    volumes:
      # Код и секреты вместе: прокси ищет их рядом с собой.
      - /opt/jobtoo-proxy:/var/www/api
      - /opt/jobtoo-php/zz-listen.conf:/usr/local/etc/php-fpm.d/zz-listen.conf:ro
    environment:
      # SB_URL отсюда убран: адрес бэкенда задан прямо в коде прокси и
      # переменной окружения больше не перекрывается. Это был аварийный откат
      # в облако — то есть настройка, которой первичная запись ПДн граждан РФ
      # уводится за границу мимо ч. 5 ст. 18 152-ФЗ. Прокси по-прежнему ходит
      # через свой же шлюз (петля внутри машины), просто адрес теперь в коде.
      #
      # Ключ подписи сессий. Заводится один раз в bootstrap.sh и лежит в
      # /opt/jobtoo-secrets/env — сюда приезжает через .env, на который
      # указывает символьная ссылка рядом с этим файлом.
      #
      # Пусто — db.php откатится на ключ базы, как было раньше, и вход
      # продолжит работать. Так сделано, чтобы выкатка не уронила вход у всех,
      # если секрет почему-то не создался.
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on: [rest]

  # Self-hosted дашборд на московском сервере.
  #
  # Не запускается: помечен профилем, а профили docker compose поднимает
  # только по явной просьбе. Значит эта часть может лежать готовой сколько
  # угодно и ничего не потреблять — ни памяти, ни внимания.
  #
  # Чтобы включить, нужно три вещи, и все три за владельцем:
  #   1. запись admin.jobtoo.ru в DNS на этот сервер;
  #   2. актуальная пара VAPID — без неё отвалятся уведомления в браузере,
  #      потому что подписки людей привязаны к этой паре ключей;
  #   3. убрать profiles отсюда и добавить блок шлюза.
  #
  # Сборка приезжает выпуском, как и веб-версия: собирать Next.js на самой
  # машине нельзя — он съедает под два гигабайта и уронит базу.
  dashboard-blue:
    image: node:22-alpine
    profiles: ["dashboard"]
    restart: unless-stopped
    # Дашборд — главный источник всплеска: при blue/green-обновлении оба слота
    # какое-то время держатся в памяти одновременно (новый проверяется, пока
    # старый ещё обслуживает). Два Node на 4 ГБ и сваливали машину в swap →
    # OOM → падал Postgres. Теперь: (1) самый высокий приоритет на убийство —
    # если память кончается, ядро берёт дашборд, а не базу; (2) жёсткий предел
    # на слот, чтобы удвоение не уходило в бесконечность. 768 МБ с запасом
    # хватает Next.js-панели; при превышении перезапустится сам этот слот.
    oom_score_adj: 900
    mem_limit: 768m
    ports: ["127.0.0.1:3002:3000"]
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - /opt/jobtoo-dashboard-blue:/app:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Серверные вызовы дашборда идут на «чистый» адрес, а не на публичный
      # jobtoo.ru: с самой московской машины обращение к своему же имени по 443
      # периодически виснет (TSPU/SNI-фильтр) — дашборд из-за этого «долго
      # грузится» и отваливается по таймауту. sslip.io ведёт на тот же nginx,
      # но мимо фильтра. Переопределяется через секреты (env-file).
      ADMIN_API_URL: ${ADMIN_API_URL:-https://147.45.184.99.sslip.io/api/admin.php}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-https://147.45.184.99.sslip.io}
      # Секреты подставляются из того же файла, что и всё остальное.
      # Ключи VAPID поступают из серверного файла переменных окружения.
      # Пропуск приложения: по нему дашборд отличает рассылку от сервера от
      # запроса с улицы. Кладётся в файл переменных из app_secrets.php.
      EXPO_PUBLIC_APP_SECRET: ${EXPO_PUBLIC_APP_SECRET:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:nikidav9@gmail.com}

  # Второй слот запускается и проверяется до переключения nginx. Поэтому
  # обновление панели не обрывает уже открытые запросы и легко откатывается.
  dashboard-green:
    image: node:22-alpine
    profiles: ["dashboard"]
    restart: unless-stopped
    # Второй слот дашборда — те же меры, что и у blue (см. выше): высокий
    # приоритет на убийство и предел памяти на слот.
    oom_score_adj: 900
    mem_limit: 768m
    ports: ["127.0.0.1:3003:3000"]
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - /opt/jobtoo-dashboard-green:/app:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Серверные вызовы дашборда идут на «чистый» адрес, а не на публичный
      # jobtoo.ru: с самой московской машины обращение к своему же имени по 443
      # периодически виснет (TSPU/SNI-фильтр) — дашборд из-за этого «долго
      # грузится» и отваливается по таймауту. sslip.io ведёт на тот же nginx,
      # но мимо фильтра. Переопределяется через секреты (env-file).
      ADMIN_API_URL: ${ADMIN_API_URL:-https://147.45.184.99.sslip.io/api/admin.php}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-https://147.45.184.99.sslip.io}
      EXPO_PUBLIC_APP_SECRET: ${EXPO_PUBLIC_APP_SECRET:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:nikidav9@gmail.com}

volumes:
  db-data:
  storage-data:
