# admin.jobtoo.ru — self-hosted дашборд на московском сервере.
#
# Подставляется, только когда сертификат на это имя уже выпущен: без него
# блок на 443 не поднимется и уронит весь шлюз вместе с сайтом.
#
# Пароль здесь не спрашиваем, в отличие от панели базы: у дашборда свой
# вход по логину и паролю, и проверяет его admin.php на сервере, а не
# браузер. Две двери подряд только раздражали бы.

server {
    listen 80;
    listen [::]:80;
    server_name admin.jobtoo.ru;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://admin.jobtoo.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.jobtoo.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.jobtoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.jobtoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:__DASHBOARD_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
