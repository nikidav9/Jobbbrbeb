# jobtoo.ru — сам сайт.
#
# Подставляется поверх остального только когда сертификат на домен уже
# выпущен: без него блок на 443 не поднимется, а перенаправление с 80 вело
# бы в никуда.
#
# До смены записи в DNS этот блок отвечает только тем, кто пришёл на адрес
# сервера с заголовком Host: jobtoo.ru, — то есть мне при проверке. Живые
# посетители всё это время идут на Reg.ru и ничего не замечают.

server {
    listen 80;
    listen [::]:80;
    # Только IPv4 (26.08). Входящий IPv6-маршрут к серверу у части сетей
    # оказался нестабилен: браузер шёл по AAAA и не откатывался на рабочий
    # IPv4 — сайт «не открывался». AAAA у домена убрана, здесь тоже больше
    # не слушаем IPv6. Он остаётся только у tg (вебхук бота) и для
    # исходящего доступа сервера к Telegram — их это не касается.
    server_name jobtoo.ru www.jobtoo.ru;

    # До TLS и раньше всего остального: сюда приходит продление сертификата.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://jobtoo.ru$request_uri; }
}

server {
    # http2 намеренно не повторяем: в этой версии nginx это настройка самого
    # слушающего сокета, заданная в блоке выше, а не свойство сайта.
    # Повторное упоминание даёт предупреждение о переопределении.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jobtoo.ru www.jobtoo.ru;

    ssl_certificate     /etc/letsencrypt/live/jobtoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobtoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;   # голосовые и фото из чатов

    # ── Заголовки безопасности ────────────────────────────────────────────
    #
    # Их не было вовсе. Главный здесь — nosniff: в бакет avatars попадает
    # присланный пользователем файл, отдаётся он с этого же имени, и без
    # запрета браузер волен угадать в нём разметку и выполнить её как свою
    # страницу.
    #
    # frame-ancestors вместо X-Frame-Options: DENY — рамку нужно оставить
    # Telegram (вход по initData), а всем прочим закрыть.
    #
    # Про camera/microphone: они у приложения рабочие — фотография в чат и
    # голосовые, — поэтому (self), а не пустой список.
    #
    # HSTS без includeSubDomains намеренно: поддомены (admin, tg) живут своей
    # жизнью, и запрет http для них стоит включать, проверив каждый отдельно.
    #
    # ВАЖНО: add_header не наследуется в location, где есть свой add_header, —
    # nginx заменяет весь набор целиком. Поэтому там, где свои add_header уже
    # были, эти же строки повторены. Добавляете заголовок здесь — добавьте и
    # там; отдельным файлом-вставкой это не сделать: bootstrap.sh склеивает
    # конфиг из кусков, и недостающий include просто не даст шлюзу подняться.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Имя одно. Иначе приложение, метрика и куки живут в двух разных
    # источниках, а пользователь этого не видит.
    if ($host = www.jobtoo.ru) { return 301 https://jobtoo.ru$request_uri; }

    root /var/www/jobtoo;
    index index.html;

    # Expo отдаёт несколько мегабайт JavaScript. Без gzip первая загрузка на
    # мобильной сети скачивает их целиком и выглядит как зависшая заставка.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # PHP-прокси: /api/db.php, /api/tg.php, /api/admin.php, /api/tgtool.php.
    # Ровно те же адреса, что сейчас на хостинге, — в этом весь смысл переноса
    # домена: в приложении не меняется ни строки, вебхук бота остаётся прежним.
    # Внешнее API. Отдельным адресом и до общего правила для .php: партнёр
    # ходит по /api/v1/vacancies, а не по имени файла, — так внутреннее
    # устройство не становится частью договора.
    # Динамика: перед CDN эти ответы нельзя кэшировать. Часть из них
    # авторизована (ответы под сессией), поэтому заголовок no-store здесь —
    # страховка: даже если на CDN включён простой режим «кэшировать всё»,
    # источник сам говорит «не клади это в кэш», и персональные данные одного
    # пользователя не отдадутся другому. private — дополнительно запрещает
    # хранение в любых общих кэшах.
    location ~ ^/api/v1/(.*)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/api.php;
        fastcgi_param SCRIPT_NAME /api/v1;
        fastcgi_param PATH_INFO /$1;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ ^/api/(.+\.php)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/$1;
        fastcgi_param SCRIPT_NAME /api/$1;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Данные и файлы — те же пути, что у временного имени <адрес>.sslip.io.
    # Пока приложение ходит по нему, но теперь есть куда переехать и им,
    # чтобы адрес из IP исчез отовсюду.
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Authorization $jt_auth;
        proxy_set_header apikey $jt_apikey;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # См. nginx-tls.conf: служебные вызовы Realtime идут не в /socket/.
    location /realtime/v1/api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host realtime-dev.localhost;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Арендатора Realtime ищет по первой части имени хоста — см. nginx-tls.conf.
        proxy_set_header Host realtime-dev.localhost;
        proxy_read_timeout 3600s;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Authorization $jt_auth;
        proxy_set_header apikey $jt_apikey;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, private" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Файлы пользователей: ничего не выполнять и не подгружать, даже если в
        # бакет когда-то уже попало что-то кроме картинки.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # То же, что делал .htaccess на хостинге: страницу-оболочку не кэшируем,
    # иначе после выкладки люди неделями сидят на старой сборке.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Главный адрес раньше проходил через обработку каталога (`$uri/`). На
    # некоторых браузерах ответ для `/` после выкладки оставался в HTTP-кэше,
    # тогда как тот же адрес с `?refresh=...` сразу открывал новую сборку.
    # Отдаём оболочку явно и с теми же запретами кэширования: пользователю
    # больше не нужен ручной параметр в ссылке.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Service worker отвечает только за push, но браузер обновляет сам worker
    # по этому адресу. Не позволяем промежуточному кэшу задержать его версию.
    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
    }

    # Сводные страницы: «работа комплектовщиком в Москве» и она же по станции.
    # Порог и перечень — в самой странице; чего нет, отдаёт 404.
    location ~ ^/rabota/([a-z-]{1,40})$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/landing_page.php;
        fastcgi_param SCRIPT_NAME /api/landing_page.php;
        include fastcgi_params;
        fastcgi_param QUERY_STRING work=$1;
        fastcgi_read_timeout 30s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ ^/rabota/([a-z-]{1,40})/([a-z0-9-]{1,80})$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/landing_page.php;
        fastcgi_param SCRIPT_NAME /api/landing_page.php;
        include fastcgi_params;
        fastcgi_param QUERY_STRING work=$1&station=$2;
        fastcgi_read_timeout 30s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Страницы вакансий, которые отдаёт сервер.
    #
    # Стоят ВЫШЕ правила о путях с расширением: идентификатор вакансии может
    # содержать точку, и тогда запрос свалился бы в честный 404 вместо страницы.
    # Порядок регулярных location в nginx — порядок их появления в файле.
    #
    # QUERY_STRING задаётся ПОСЛЕ include: fastcgi_params выставляет его из
    # $query_string и затёр бы наш.
    location ~ ^/v/(.{1,128})$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/vacancy_page.php;
        fastcgi_param SCRIPT_NAME /api/vacancy_page.php;
        include fastcgi_params;
        fastcgi_param QUERY_STRING kind=perm&id=$1;
        fastcgi_read_timeout 30s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ ^/s/(.{1,128})$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/vacancy_page.php;
        fastcgi_param SCRIPT_NAME /api/vacancy_page.php;
        include fastcgi_params;
        fastcgi_param QUERY_STRING kind=shift&id=$1;
        fastcgi_read_timeout 30s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Карта сайта собирается из базы, а не лежит файлом: в статическом файле
    # страниц вакансий не было и быть не могло.
    location = /sitemap.xml {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/sitemap.php;
        fastcgi_param SCRIPT_NAME /api/sitemap.php;
        include fastcgi_params;
        fastcgi_param QUERY_STRING "";
        fastcgi_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Имена файлов Expo в этих каталогах содержат отпечаток содержимого.
    # Новая сборка получает новый URL, поэтому старую можно безопасно держать
    # год и не скачивать повторно при каждом запуске приложения.
    location ^~ /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Публичная проверка раскрывает только доступность. Полный отчёт и
    # история содержат внутренние службы, счётчики и журналы.
    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 200 '{"ok":true}\n';
    }
    location = /status.json { return 404; }
    location = /health-history.ndjson { return 404; }
    location = /apply.log { return 404; }

    # SPA-маршруты не имеют расширения. Путь, похожий на файл, не должен
    # превращаться в index.html с кодом 200: это создаёт бесконечные soft 404.
    # Служебные пространства исключены, чтобы не перехватить API и файлы людей.
    location ~* ^/(?!api/|rest/|realtime/|storage/).+\.[^/]+$ {
        try_files $uri =404;
    }

    # Приложение одностраничное: пути без расширения отдаёт оболочка.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Панель базы — на отдельном порту и в корне.
#
# Под путём /studio/ она не работала: это приложение Next.js, оно ждёт себя
# в корне и запрашивает ресурсы по /_next/..., мимо любого префикса. Проще
# дать ей собственный порт, чем переписывать половину путей.
#
# Здесь, а не рядом с временным именем: адрес из цифр убран отовсюду, и
# панель была последним местом, где он оставался.
server {
    listen 8443 ssl http2;
    server_name jobtoo.ru www.jobtoo.ru;

    ssl_certificate     /etc/letsencrypt/live/jobtoo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobtoo.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # За паролем: панель показывает переписку и телефоны 420 человек.
    auth_basic "JobToo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 60m;

    # Значения для настроек репозитория. Здесь, а не на общем порту: эта
    # часть за паролем, а status.json открыт всем.
    location = /token.txt {
        alias /var/www/private/token.txt;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
