# Защищённая часть. Подставляется поверх основной, когда сертификат выпущен.
#
# Отдельным файлом, а не правкой certbot: bootstrap переписывает конфигурацию
# каждую минуту и стирал всё, что certbot туда вносил. Сертификат был, а
# отдавать его было некому — TLS-рукопожатие обрывалось.
#
# __HOST__ подставляется при разворачивании.

server {
    # http2 отдельной директивой появился в nginx 1.25, в Ubuntu 24.04 — 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;

    # Полноценная запасная дверь к приложению под именем, которое DPI не режет
    # (в нём нет строки «jobtoo.ru»). Тот же корень и те же правила кэширования,
    # что у боевого блока jobtoo.ru в nginx-site.conf: и оболочка, и бэкенд
    # теперь живут на одном чистом имени, поэтому приложение открывается целиком,
    # а не только его backend-заглушка. jobtoo.ru это не затрагивает — здесь
    # отдельный server-блок с отдельным именем.
    root /var/www/jobtoo;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        # Мост со старого ключа на новый — см. bootstrap.sh, раздел про мост.
        proxy_set_header Authorization $jt_auth;
        proxy_set_header apikey $jt_apikey;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Служебные вызовы Realtime — не вебсокет, а обычный запрос. Через них
    # прокси шлёт приложению сигнал «перечитай». Отдельным блоком и выше
    # общего: тот уводит всё в /socket/, а этому нужен /api/.
    location /realtime/v1/api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host realtime-dev.localhost;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Realtime определяет «арендатора» по первой части имени хоста, а наш
        # 147.45.184.99.sslip.io ему ничего не говорит — отсюда 403 на всякое
        # подключение и молчащие чаты. Подставляем имя заведённого арендатора.
        proxy_set_header Host realtime-dev.localhost;
        proxy_read_timeout 3600s;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Authorization $jt_auth;
        proxy_set_header apikey $jt_apikey;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # PHP-прокси: те же адреса, что сейчас на jobtoo.ru/api/*.
    # Совпадение путей намеренное — тогда переезд для приложения сводится к
    # смене имени сервера, без единой правки в коде.
    location ~ ^/api/(.+\.php)$ {
        root /var/www;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/api/$1;
        fastcgi_param SCRIPT_NAME /api/$1;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location = /health { default_type application/json; add_header Cache-Control "no-store" always; return 200 '{"ok":true}\n'; }
    location = /security-status.json {
        alias /var/www/html/security-status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Результат разведки карьерных сайтов с этой же машины. Секретов в нём нет:
    # это публичные адреса карьерных страниц — тот же перечень, что лежит в
    # открытом репозитории в scripts/career-sites.tsv, — и предложенные
    # соответствия полей. Лежит рядом с security-status.json по той же причине:
    # это рабочий файл, который надо уметь прочитать снаружи.
    location = /career-discovery.json {
        alias /var/www/html/career-discovery.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /status.json { return 404; }
    location = /health-history.ndjson { return 404; }
    location = /apply.log { return 404; }

    # Оболочку не кэшируем — иначе после выкладки останется старая сборка.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Файлы Expo содержат отпечаток в имени — их можно держать в кэше долго.
    location ^~ /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Одностраничное приложение: любой прочий путь отдаёт оболочку.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Панель базы переехала в nginx-site.conf — на домен, а не на имя из IP.
