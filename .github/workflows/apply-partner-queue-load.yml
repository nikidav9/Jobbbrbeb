name: Apply partner queue load hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-partner-queue-load.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply_partner_queue_load.py

      - name: Validate partner load hardening
        run: |
          git diff --check
          php -l php-proxy/sb_lite.php
          php -l php-proxy/partner_outbox.php
          php -l php-proxy/partner_webhook.php
          php -l php-proxy/ingest.php
          php -l tests/partner_feed_load_test.php
          php tests/partner_core_test.php
          PARTNER_LOAD_ROWS=50000 php tests/partner_feed_load_test.php
          bash tests/partner_queue_load.sh
          npm ci
          npm test
          npm run typecheck

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            php-proxy/sb_lite.php \
            php-proxy/partner_outbox.php \
            php-proxy/partner_webhook.php \
            php-proxy/ingest.php \
            supabase/migrations/067_partner_queue_claims.sql \
            tests/partner_core_test.php \
            tests/partner_feed_load_test.php \
            tests/partner_queue_load.sh
          git commit -m "fix: harden partner queues under load"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
