name: Apply remaining db authorization fixes

on:
  push:
    branches: [codex/release-candidate-2026-09-14]
    paths:
      - .github/workflows/apply-db-relation-authz.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-candidate-2026-09-14
          fetch-depth: 0

      - name: Apply guarded source patch
        run: |
          python3 scripts/apply_db_relation_authz.py
          python3 scripts/fix_db_object_authz_test_quotes.py

      - name: Validate patch
        run: |
          git diff --check
          php -l php-proxy/db.php
          php -l tests/db_object_authz_test.php
          php tests/db_object_authz_test.php
          php tests/perm_app_test.php
          php tests/like_authz_test.php
          php tests/read_authz_test.php
          php tests/group_post_test.php

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add php-proxy/db.php tests/db_object_authz_test.php
          git commit -m "fix: bind chats and analytics to server identity"
          git fetch origin codex/release-candidate-2026-09-14
          git rebase origin/codex/release-candidate-2026-09-14
          git push origin HEAD:codex/release-candidate-2026-09-14
