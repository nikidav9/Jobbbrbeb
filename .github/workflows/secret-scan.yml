name: Secret scan

# Токены и ключи не должны попасть в публичный репозиторий (03.10.2026: токен
# телеграм-бота из старой истории git, реклама VPN в описании бота). Смотрим
# только строки, добавленные PR: scripts/secret-scan.py. Значение не печатается.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Added lines have no secrets
        if: github.event_name == 'pull_request'
        run: python3 scripts/secret-scan.py --base "origin/${{ github.base_ref }}"

      - name: Whole tree has no secrets
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/secret-scan.py --all
