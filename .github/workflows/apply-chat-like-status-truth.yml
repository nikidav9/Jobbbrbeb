name: Apply truthful chat like status

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_chat_like_status_truth.py'
      - '.github/workflows/apply-chat-like-status-truth.yml'

permissions:
  contents: write

concurrency:
  group: apply-chat-like-status-truth
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply guarded patch
        run: python3 scripts/apply_chat_like_status_truth.py

      - name: Focused network contract
        run: python3 tests/network_action_truth_test.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Diff guard
        run: git diff --check

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/chat-room.tsx tests/network_action_truth_test.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: surface chat application status failures'
          git push origin HEAD:main
