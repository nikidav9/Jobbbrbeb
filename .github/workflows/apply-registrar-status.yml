name: Apply registrar status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-registrar-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 scripts/apply_registrar_status.py
      - name: Validate manual state
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('docs/ручные-шаги.md').read_text(encoding='utf-8')
          assert '### А5. Перенос регистрации в Timeweb — завершён ✅' in s
          assert 'регистратор — `TIMEWEB-RU`' in s
          assert '**23.05.2027**' in s
          assert 'Из кабинета остаётся проверить **автопродление**' in s
          assert '4. ✅ **Перенос регистрации завершён**' in s
          print('registrar manual status: OK')
          PY
      - name: Commit documentation fix
        run: |
          if git diff --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/ручные-шаги.md'
          git commit -m 'docs: mark registrar transfer complete'
          git pull --rebase origin main
          git push origin HEAD:main
