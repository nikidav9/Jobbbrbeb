name: Проверка доступности сайта

on:
  schedule:
    # GitHub Actions не гарантирует точное время запуска: даже этот честный
    # интервал под нагрузкой может задержаться. */5 раньше фактически давал
    # проверки лишь раз в 2–4 часа и создавал ложное чувство наблюдения.
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # Изменения самого production-probe и его migration/RLS-контракта должны
  # проверяться сразу, а не ждать следующего неточного schedule.
  push:
    branches: [main]
    paths:
      - 'infra/check-site.sh'
      - 'infra/migrate.sh'
      - 'infra/verify-rls.sh'
      - 'supabase/migrations/**'
      - '.github/workflows/site-availability.yml'

concurrency:
  group: jobtoo-site-availability
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Проверить сайт, приложение, API и админ-панель
        id: health
        continue-on-error: true
        run: |
          set +e
          REPORT="$RUNNER_TEMP/site-health.log" bash infra/check-site.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          flaps=$(grep -oE 'flaps=[0-9]+' "$RUNNER_TEMP/site-health.log" | tail -1 | cut -d= -f2)
          echo "flaps=${flaps:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "## Доступность JobToo"
            echo "- итог: $([ "$code" = 0 ] && echo ✅ healthy || echo ❌ failed)"
            echo "- замеченных провалов: ${flaps:-0}"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/site-health.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Сохранить диагностический журнал
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health-${{ github.run_id }}
          path: ${{ runner.temp }}/site-health.log
          retention-days: 30

      - name: Записать сбой или восстановление в GitHub Issues
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_EXIT_CODE: ${{ steps.health.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Автомониторинг: jobtoo.ru недоступен';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = process.env.HEALTH_EXIT_CODE !== '0';
            const reportPath = process.env.RUNNER_TEMP + '/site-health.log';
            const report = fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : 'Журнал не найден';
            const failedLines = report.split('\n')
              .filter(line => /FAIL|ERROR|fails_.*=[1-9]/.test(line))
              .slice(-40)
              .join('\n');
            const details = failedLines || report.slice(-5000);
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const incident = issues.find(issue => issue.title === title);

            if (failed) {
              const body = `Внешняя проверка обнаружила сбой **${new Date().toISOString()}**.\n\n` +
                `Проверяются сайт, IPv4, API, JS/CSS приложения, вход в админ-панель и её JS/CSS.\n\n` +
                `### Что не прошло\n\n\`\`\`text\n${details}\n\`\`\`\n\n` +
                `[Полный журнал и timing-данные](${runUrl})`;
              if (incident) {
                await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body });
              } else {
                await github.rest.issues.create({
                  owner, repo, title,
                  body: body + '\n\nIssue будет закрыт автоматически после восстановления.',
                });
              }
            } else if (incident) {
              const started = new Date(incident.created_at);
              const recovered = new Date();
              const durationMinutes = Math.max(1, Math.round((recovered - started) / 60000));
              await github.rest.issues.createComment({
                owner, repo, issue_number: incident.number,
                body: `Сайт и админ-панель снова полностью доступны **${recovered.toISOString()}**. ` +
                  `Оценочная длительность инцидента: **${durationMinutes} мин.**\n\n[Контрольный прогон](${runUrl})`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: incident.number, state: 'closed' });
            }

      - name: Завершить workflow ошибкой при недоступности
        if: steps.health.outputs.exit_code != '0'
        run: exit 1
