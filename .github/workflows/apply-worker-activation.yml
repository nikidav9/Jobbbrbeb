name: Apply full worker activation funnel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-worker-activation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded source patch
        run: python3 scripts/apply_worker_activation.py

      - name: Validate app analytics tests
        run: |
          git diff --check
          npm ci
          npm test
          npm run typecheck

      - name: Validate dashboard build
        working-directory: dashboard
        env:
          ADMIN_API_URL: https://example.invalid/api/admin.php
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          ADMIN_API_TOKEN: ci-placeholder
          VAPID_PUBLIC_KEY: ci-placeholder
          VAPID_PRIVATE_KEY: ci-placeholder
          VAPID_SUBJECT: mailto:ci@example.invalid
        run: |
          npm ci
          npm run build

      - name: Commit full activation funnel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/lib/queries.ts dashboard/app/funnel/page.tsx docs/план-разработки.md
          git commit -m "analytics: complete worker activation funnel"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
