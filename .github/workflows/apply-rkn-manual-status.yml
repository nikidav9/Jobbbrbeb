name: Apply RKN manual status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rkn-manual-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 scripts/apply_rkn_manual_status.py
      - name: Validate status wording
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('docs/ручные-шаги.md').read_text(encoding='utf-8')
          assert '№ 02-11-33294/77' in s
          assert '№ 02-11-34185/77' in s
          assert '02.10.2026' in s
          assert '08.10.2026' in s
          assert 'ничего повторно подавать не нужно' in s
          assert 'Повторно подавать форму не нужно' in s
          assert 'формулируем статус именно как\n«направлено», а не «зарегистрировано»' in s
          print('RKN manual status: OK')
          PY
      - name: Commit documentation fix
        run: |
          if git diff --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/ручные-шаги.md'
          git commit -m 'docs: mark RKN notices as submitted'
          git pull --rebase origin main
          git push origin HEAD:main
