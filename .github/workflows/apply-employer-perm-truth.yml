name: Apply truthful employer permanent application actions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_employer_perm_truth.py'
      - '.github/workflows/apply-employer-perm-truth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 scripts/apply_employer_perm_truth.py
      - name: Validate focused contracts
        run: |
          git diff --check
          python3 tests/network_action_truth_test.py
          python3 tests/perm_app_atomicity_test.py
          npm ci
          npm run typecheck
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(tabs)/matches.tsx' components/feature/PermApplicationsSheet.tsx tests/network_action_truth_test.py
          git commit -m 'fix: keep employer application decisions truthful'
          git push origin HEAD:main
