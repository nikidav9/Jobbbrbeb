name: Career source regressions

on:
  pull_request:
    paths:
      - 'php-proxy/career*.php'
      - 'tests/career_new_sources_test.php'
      - 'tests/sber_official_source_test.php'
      - 'supabase/migrations/*career*.sql'
      - 'supabase/migrations/092_kaspersky_selectel_koronatech.sql'
      - 'supabase/migrations/095_sber_restore_official_api.sql'
  push:
    branches:
      - main
    paths:
      - 'php-proxy/career*.php'
      - 'tests/career_new_sources_test.php'
      - 'tests/sber_official_source_test.php'
      - 'supabase/migrations/*career*.sql'
      - 'supabase/migrations/092_kaspersky_selectel_koronatech.sql'
      - 'supabase/migrations/095_sber_restore_official_api.sql'

permissions:
  contents: read

jobs:
  career-sources:
    name: Direct employer career sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l php-proxy/career_feed.php && php -l tests/career_new_sources_test.php && php -l tests/sber_official_source_test.php
      - name: Direct employer regressions
        run: |
          php tests/career_new_sources_test.php
          php tests/sber_official_source_test.php
