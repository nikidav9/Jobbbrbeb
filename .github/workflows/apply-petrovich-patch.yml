name: Одноразовый патч Петровича

on:
  push:
    branches:
      - feat/petrovich-career
    paths:
      - scripts/apply-petrovich-patch.py
      - .github/workflows/apply-petrovich-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/petrovich-career
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply-petrovich-patch.py
      - name: PHP syntax
        run: php -l php-proxy/career_feed.php
      - name: Career feed regression tests
        run: php tests/career_feed_test.php
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add php-proxy/career_feed.php tests/career_feed_test.php scripts/career-sites.tsv scripts/owner-career-sites.tsv
          git diff --cached --quiet && exit 0
          git commit -m "Подключить HTML-каталог вакансий Петровича"
          git push origin HEAD:feat/petrovich-career
