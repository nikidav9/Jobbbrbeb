name: Логотипы компаний в базу

# Проверенный набор data/company-logos (решение владельца 02.10.2026)
# заливается после каждой выкладки сервера и раз в сутки: шлются только
# новые и изменившиеся картинки (scripts/upload-company-logos.py).
on:
  workflow_run:
    workflows:
      - Сборка сайта и доставка на московский сервер
    types: [completed]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-logos
  cancel-in-progress: false

jobs:
  upload:
    name: Залить новые логотипы
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Залить
        env:
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          ADMIN_TOKEN: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$APP_SECRET" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo "Серверные секреты для задания не настроены"; exit 1
          fi
          python3 scripts/upload-company-logos.py
