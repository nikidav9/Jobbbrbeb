name: Apply truthful shift skip

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_skip_truth.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply guarded patch
        run: python3 scripts/apply_skip_truth.py
      - name: Offline regression guard
        run: php tests/offline_states_test.php
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(tabs)/feed.tsx' tests/offline_states_test.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore skipped shift when server write fails'
          git pull --rebase origin main
          git push origin HEAD:main
