name: Apply vacancy SEO quality fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-vacancy-seo-quality.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('php-proxy/vacancy_page.php')
          test = Path('tests/vacancy_page_test.php')
          s = page.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              s = s.replace(old, new, 1)

          once(
          """        'directApply' => true,
                  'hiringOrganization' => [
                      '@type' => 'Organization',
                      'name' => (string)$v['company'],
                  ],
              ];
              if ($v['description'] !== '') $ld['description'] = $v['description'];""",
          """        'directApply' => true,
              ];
              // Название работодателя иногда отсутствует в старых карточках. Не
              // выдумываем его и не публикуем пустой Organization в JSON-LD.
              if ($v['company'] !== '') {
                  $ld['hiringOrganization'] = [
                      '@type' => 'Organization',
                      'name' => (string)$v['company'],
                  ];
              }
              if ($v['description'] !== '') $ld['description'] = $v['description'];""",
          'json-ld company')

          once(
          """        $metaDesc = $v['company'] . ' ищет: ' . $v['title']
                      . ($v['address'] !== '' ? ', ' . $v['address'] : '');""",
          """        $metaDesc = ($v['company'] !== '' ? $v['company'] . ' ищет: ' : '') . $v['title']
                      . ($v['address'] !== '' ? ', ' . $v['address'] : '');""",
          'meta description')

          once(
          """    $pageTitle = $v['title'] . ' — ' . $v['company']
                  . ($v['metro'] !== '' ? ', ' . $v['metro'] : '') . ' | JobToo';""",
          """    $pageTitle = $v['title']
                  . ($v['company'] !== '' ? ' — ' . $v['company'] : '')
                  . ($v['metro'] !== '' ? ', ' . $v['metro'] : '') . ' | JobToo';""",
          'page title')

          once(
          """        . '<h1>' . vp_e($v['title']) . '</h1>'
                  . '<p class=\"company\">' . vp_e($v['company']) . '</p>'
                  . ($facts !== '' ? '<ul class=\"facts\">' . $facts . '</ul>' : '')""",
          """        . '<h1>' . vp_e($v['title']) . '</h1>'
                  . ($v['company'] !== '' ? '<p class=\"company\">' . vp_e($v['company']) . '</p>' : '')
                  . ($facts !== '' ? '<ul class=\"facts\">' . $facts . '</ul>' : '')""",
          'visible company')

          page.write_text(s)

          t = test.read_text()
          anchor = """check('нет отметки о закрытии', !str_contains(mb_strtolower($html), 'вакансия закрыта'));

          // Пустые поля не выдумываем: за ложные данные в разметке наказывают."""
          insert = """check('нет отметки о закрытии', !str_contains(mb_strtolower($html), 'вакансия закрыта'));

          // Старые вакансии встречаются без компании. Не рисуем тире перед пустотой,
          // не создаём пустой hiringOrganization и не показываем пустой абзац.
          $htmlNoCompany = render(array_merge($base, [
              'company' => '',
              'salary' => 90000,
              'schedule' => '5/2',
              'description' => '',
          ]), 'perm');
          $ldNoCompany = json_ld($htmlNoCompany);
          check('пустая компания не ломает title', !str_contains($htmlNoCompany, '— ,'));
          check('пустой hiringOrganization не публикуется', !isset($ldNoCompany['hiringOrganization']));
          check('пустой абзац компании не публикуется', !str_contains($htmlNoCompany, '<p class=\"company\"></p>'));
          check('fallback description остаётся осмысленным', str_contains($htmlNoCompany, 'Комплектовщик на склад'));

          // Пустые поля не выдумываем: за ложные данные в разметке наказывают."""
          if t.count(anchor) != 1:
              raise SystemExit(f'test anchor: expected 1, got {t.count(anchor)}')
          test.write_text(t.replace(anchor, insert, 1))
          PY

      - name: Validate
        run: |
          git diff --check
          php -l php-proxy/vacancy_page.php
          php tests/vacancy_page_test.php
          python3 tests/seo_infra_test.py

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add php-proxy/vacancy_page.php tests/vacancy_page_test.php
          git commit -m "seo: handle vacancies without company names"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
