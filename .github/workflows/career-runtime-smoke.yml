name: Карьерный каталог production

on:
  schedule:
    # После ночных обновлений, но не одновременно с большинством cron на :00.
    - cron: '23 4 * * *'
  workflow_dispatch:
  # Главная проверка — после реальной доставки на московский сервер, а не после
  # merge. Иначе smoke может успеть раньше минутного migrate/sync на production.
  workflow_run:
    workflows:
      - Сборка сайта и доставка на московский сервер
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: career-runtime-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Все страницы career_owner без failed/skipped
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Дать production применить sync после deploy
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 75
      - name: Пройти career_owner до has_more=false
        env:
          CAREER_SMOKE_URL: https://jobtoo.ru/api/career.php?source=career_owner
          CAREER_SMOKE_MIN_ITEMS: '500'
          CAREER_SMOKE_MAX_HOPS: '250'
          CAREER_SMOKE_TIMEOUT_MS: '45000'
        run: node scripts/career-runtime-smoke.mjs
