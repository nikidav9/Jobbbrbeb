name: Apply truthful partner application states

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-matches-partner-truth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_matches_partner_truth.py')
          text = p.read_text()
          p.write_text(text.replace(r'numberOfLines=\"1\"', 'numberOfLines={1}'))
          PY
          python3 scripts/apply_matches_partner_truth.py
          python3 scripts/update_matches_offline_guard.py

      - name: Validate
        run: |
          git diff --check
          php tests/offline_states_test.php
          npm ci
          npm test
          npm run typecheck

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(tabs)/matches.tsx' tests/offline_states_test.php
          git commit -m "fix: keep partner application lists truthful"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
