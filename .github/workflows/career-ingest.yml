name: Забрать вакансии с карьерных сайтов

# Единственный способ наполнить jm_ext_vacancies: сервер идёт по адресам
# из connector_config источника career_owner, парсит страницы/JSON и кладёт
# вакансии в таблицу. Без этого задания таблица остаётся пустой, а Jupiter
# не имеет вакансий, на которые подавать.
#
# Частота: каждые 6 часов. period_min в источнике тоже 360. Чаще
# бессмысленно — карьерные страницы обновляются не в реальном времени, —
# а запросы к чужим серверам на каждый заход неизбежны.
#
# Что происходит. Один вызов ingest.php запускает обход: он зовёт
# career.php?source=career_owner, тот поочерёдно ходит по каждому endpoint
# из connector_config (Пятёрочка, ВкусВилл, METRO, Лемана ПРО, …),
# нормализует ответ и отдаёт в общем формате. ingest.php пишет
# jm_ext_vacancies, гасит протухшие и ведёт журнал jm_ext_ingest_runs.
#
# Падение одного endpoint'а не ломает остальные: career.php возвращает
# partial=true и переходит к следующему, а ingest не гасит его вакансии.

on:
  schedule:
    # 02:30, 08:30, 14:30, 20:30 UTC — каждые 6 часов со сдвигом,
    # чтобы не совпадать с ежечасным announce-missed.
    - cron: '30 2,8,14,20 * * *'
    # Ежечасно в :45 — только адреса с настоящим API (scope=api): новые
    # вакансии Сбера, Магнита, Яндекса и др. появляются в ленте в течение
    # часа. Сайты со ссылками здесь не обходятся — их чаще раза в шесть
    # часов не трогаем, и гашения закрытых этот заход не делает.
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'ID источника (по умолчанию career_owner)'
        default: 'career_owner'
      force:
        description: 'Перезабрать даже если period_min не прошёл'
        type: boolean
        default: false
      scope:
        description: 'api — только адреса с API, без гашения; пусто — полный круг'
        default: ''

# Ежечасный заход и полный круг не стоят в очереди друг за другом, но два
# одинаковых захода подряд не наслаиваются.
concurrency:
  group: career-ingest-${{ (github.event.schedule == '45 * * * *' || github.event.inputs.scope == 'api') && 'api' || 'full' }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Забрать карьерные вакансии
    runs-on: ubuntu-latest
    # Сбор — до полутора часов (внутри обхода ingest дочитывает описания
    # страниц вакансий), за ним дозагрузка описаний: ~70–100 страниц за вызов
    # describe.php. Одним заходом, а не сутками по кускам.
    timeout-minutes: 300
    steps:
      - name: Вызвать ingest.php
        env:
          ADMIN_TOKEN: ${{ secrets.DASHBOARD_PASSWORD }}
          SOURCE: ${{ github.event.inputs.source || 'career_owner' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          SCOPE: ${{ (github.event.schedule == '45 * * * *' || github.event.inputs.scope == 'api') && 'api' || '' }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "DASHBOARD_PASSWORD не настроен в секретах репозитория"; exit 1
          fi

          URL="https://jobtoo.ru/api/ingest.php?source=${SOURCE}"
          if [ "$FORCE" = "true" ]; then
            URL="${URL}&force=1"
          fi
          if [ "$SCOPE" = "api" ]; then
            URL="${URL}&scope=api"
          fi

          # ingest.php работает инкрементально: каждый вызов обходит
          # страницы до deadline, сохраняет checkpoint и возвращает
          # «продолжение». Зовём повторно, пока не получим финальный
          # ответ (без «продолжение») или не упрёмся в предел попыток.
          # 25.09 полный круг не уложился в 20 вызовов (97 страниц из ~150:
          # обход дочитывает описания и идёт по 1–2 страницы за вызов) и
          # покраснел, хотя данные не потеряны — checkpoint дочитал круг
          # следующим заходом. 60 вызовов по ~80 с — около 80 минут.
          MAX=60
          for attempt in $(seq 1 $MAX); do
            RESP=$(curl -fsS -X GET "$URL" \
              -H "X-Admin-Token: $ADMIN_TOKEN" \
              --max-time 600) || RESP=''
            echo "Вызов $attempt/$MAX: $RESP"

            if [ -z "$RESP" ]; then
              echo "Пустой ответ, повтор через 15 секунд"
              sleep 15
              continue
            fi

            # «продолжение» = ещё не всё, зовём снова.
            if echo "$RESP" | grep -q '"продолжение'; then
              echo "Инкрементальный обход, продолжаем..."
              sleep 5
              continue
            fi

            # Финальный ответ — обход завершён.
            echo "Забор завершён"
            echo "$RESP" | python3 -m json.tool 2>/dev/null || true
            exit 0
          done

          echo "ingest.php не завершился за $MAX вызовов"; exit 1

      # Полное описание (php-proxy/vacancy_text.php, со структурой) — отдельно
      # от самого ingest.php: сходить за ним на каждую вакансию во время обхода
      # значило бы не уложиться в бюджет. describe.php дозагружает очередь
      # пачками, пока remaining не дойдёт до нуля или не кончатся попытки.
      # Неудача этого шага не должна валить весь workflow: вакансии уже
      # забраны, а короткое описание в карточке уже есть — это лишь дозагрузка.
      # Ежечасный заход описания не дочитывает: очередь может быть длиной в
      # часы, и такой шаг наслаивался бы на следующий час. Новые вакансии
      # получают полное описание на ближайшем полном круге, а короткое
      # у них есть сразу.
      - name: Дочитать описания
        if: ${{ !(github.event.schedule == '45 * * * *' || github.event.inputs.scope == 'api') }}
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "DASHBOARD_PASSWORD не настроен в секретах репозитория"; exit 1
          fi

          # 150 вызовов по 75 с — до трёх часов, хватает на всю очередь разом;
          # цикл выходит раньше, как только remaining = 0.
          MAX=150
          for attempt in $(seq 1 $MAX); do
            RESP=$(curl -fsS -X GET "https://jobtoo.ru/api/describe.php" \
              -H "X-Admin-Token: $ADMIN_TOKEN" \
              --max-time 120) || RESP=''
            echo "Вызов $attempt/$MAX: $RESP"

            if [ -z "$RESP" ]; then
              echo "Пустой ответ, повтор через 5 секунд"
              sleep 5
              continue
            fi

            REMAINING=$(echo "$RESP" | grep -oE '"remaining":[0-9]+' | grep -oE '[0-9]+')
            if [ -z "$REMAINING" ] || [ "$REMAINING" = "0" ]; then
              echo "Очередь дочитана"
              exit 0
            fi

            echo "Осталось в очереди: $REMAINING, продолжаем"
            sleep 5
          done

          echo "describe.php не опустошил очередь за $MAX вызовов — доберёт в следующий заход"
