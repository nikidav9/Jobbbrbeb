name: Apply truthful profile stats

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_profile_stats_truth.py'
      - '.github/workflows/apply-profile-stats-truth.yml'

permissions:
  contents: write

concurrency:
  group: apply-profile-stats-truth
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply guarded patch
        run: python3 scripts/apply_profile_stats_truth.py

      - name: Focused offline contract
        run: php tests/offline_states_test.php

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Diff guard
        run: git diff --check

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/user-profile.tsx tests/offline_states_test.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: surface profile responsiveness failures'
          git push origin HEAD:main
