name: Apply truthful consent network state

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_profile_consent_network_truth.py'
      - '.github/workflows/apply-profile-consent-network-truth.yml'

permissions:
  contents: write

concurrency:
  group: apply-profile-consent-network-truth
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 scripts/apply_profile_consent_network_truth.py
      - name: Validate focused network truth
        run: |
          git diff --check
          python3 tests/network_action_truth_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(tabs)/profile.tsx' tests/network_action_truth_test.py 'docs/план-разработки.md'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: surface consent status network failures'
          git pull --rebase origin main
          git push origin HEAD:main
