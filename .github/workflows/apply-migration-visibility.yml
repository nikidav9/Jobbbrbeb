name: Apply migration parity monitoring

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-migration-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply_migration_visibility.py

      - name: Validate
        run: |
          git diff --check
          bash -n infra/report.sh
          bash -n infra/check-site.sh
          python3 tests/deploy_migration_order_test.py
          npm ci
          npm test
          npm run typecheck

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/report.sh infra/check-site.sh tests/deploy_migration_order_test.py
          git commit -m "chore: monitor production migration parity"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
