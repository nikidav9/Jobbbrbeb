name: Apply atomic permanent approval

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-atomic-perm-approval.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply_atomic_perm_approval.py

      - name: Validate
        run: |
          git diff --check
          php -l php-proxy/db.php
          php tests/perm_app_test.php
          php tests/message_notify_test.php
          python3 tests/perm_app_atomicity_test.py
          python3 tests/deploy_migration_order_test.py
          npm ci
          npm test
          npm run typecheck

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'supabase/migrations/068_atomic_perm_approval.sql' \
            'php-proxy/db.php' \
            'services/db.ts' \
            'components/feature/PermApplicationsSheet.tsx' \
            'app/(tabs)/matches.tsx' \
            'tests/perm_app_test.php' \
            'tests/perm_app_atomicity_test.py'
          git commit -m "fix: make permanent approval atomic"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
