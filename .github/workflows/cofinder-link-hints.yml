name: Сверка прямых ссылок Cofinder

# Диагностический, read-only прогон. Cofinder не становится источником ленты:
# мы берём 1–2 публичные прямые ссылки как подсказку, чтобы проверять URL-шаблон
# работодателя, найденный нашим Playwright/Firecrawl-разведчиком.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/career-sites.tsv'
      - 'scripts/cofinder-link-hints.mjs'
      - '.github/workflows/cofinder-link-hints.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Сколько компаний JobToo сверить (0 — весь список)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: cofinder-link-hints
  cancel-in-progress: false

jobs:
  hints:
    name: Сверить компании и прямые URL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint scripts/cofinder-link-hints.mjs

      - name: Read-only сверка
        env:
          COFINDER_HINTS_OUT: cofinder-link-hints.json
          COFINDER_HINTS_LIMIT: ${{ inputs.limit }}
          COFINDER_HINTS_SAMPLES: '2'
          COFINDER_HINTS_CONCURRENCY: '2'
          COFINDER_HINTS_PAUSE_MS: '500'
        run: node scripts/cofinder-link-hints.mjs

      - name: Краткий итог
        if: always()
        run: |
          if [ -s cofinder-link-hints.json ]; then
            node -e "const r=require('./cofinder-link-hints.json'); console.log(r.stats)"
          fi

      - name: Забрать отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofinder-link-hints-${{ github.run_id }}
          path: cofinder-link-hints.json
          if-no-files-found: warn
          retention-days: 14
