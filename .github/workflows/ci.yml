name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PHP syntax
        run: find php-proxy -name '*.php' -print0 | xargs -0 -n1 php -l


      - name: Страница вакансии отдаёт содержимое и разметку
        run: php tests/vacancy_page_test.php

      - name: Сводные страницы считают, а не выдумывают
        run: php tests/landing_page_test.php

      - name: Карта сайта не собирается заново на каждый запрос
        run: php tests/sitemap_cache_test.php

      - name: Приглашение платит за выход на смену, а не за отклик
        run: php tests/referral_test.php

      - name: Смену закрывает её сторона, а не любой вошедший
        run: php tests/shift_authz_test.php

      - name: Объявление в группу доходит, а отказ виден
        run: php tests/group_post_test.php

      - name: Вход по почте — коды, квитанции, письмо доходит до SMTP
        run: php tests/auth_email_test.php

      - name: Согласие на обработку данных пишется и его пропажу видно
        run: php tests/consent_test.php

      - name: Решение по отклику принимает владелец вакансии и оно доходит
        run: php tests/perm_app_test.php

      - name: Откликнуться можно только с загруженным резюме
        run: php tests/apply_requires_resume_test.php

      - name: Заявки Jupiter — свои свои, воркер не подменяет чужое
        run: php tests/jupiter_applications_test.php

      - name: Поручение на автоотклик Юпитера включается документами, отзыв настоящий
        run: php tests/jupiter_live_consent_test.php

      - name: Почта JobToo — читаемый адрес, повтор получает цифру
        run: php tests/jupiter_mail_address_test.php

      - name: Лента карьерных вакансий — компании чередуются, свайпы учитываются
        run: php tests/ext_feed_test.php

      - name: Разделы ленты — название вакансии ведёт в свой раздел
        run: php tests/job_sections_test.php

      - name: Проводка разделов ленты и свайпов постоянных вакансий до db.php
        run: php tests/feed_sections_wiring_test.php

      - name: Карьерная страница превращается в вакансии, а не в мусор
        run: php tests/career_feed_test.php

      - name: Полное описание вакансии со страницы сохраняет структуру
        run: php tests/vacancy_text_test.php

      - name: Дозагрузка описаний — троттлер, очередь, что пишем в карточку
        run: php tests/describe_test.php

      - name: Карточка свайпа — никуда не ведёт, листается, без плашки «Отвечает»
        run: php tests/swipe_card_test.php

      - name: Сертификат Минцифры — только три банка и только сборщик
        run: php tests/ru_ca_scope_test.php

      - name: Открытые счётчики ленты — только числа и названия компаний
        run: php tests/feed_stats_test.php

      - name: Описание из API источника — разделы, карточка вакансии, курсор
        run: php tests/career_api_description_test.php

      - name: Карьерная выдача — мусор не проходит, вакансии не теряются
        run: php tests/career_quality_test.php

      - name: Закрытые вакансии гаснут по сайтам, ежечасный заход по API не гасит
        run: php tests/ingest_host_deactivation_test.php

      - name: Карьерный JSON разбирается по карте полей
        run: php tests/career_json_test.php

      - name: Карьерный коннектор ходит тем же методом, что записан
        run: php tests/career_http_method_test.php

      - name: Разведка проверяет карьерный endpoint тем же кодом, что идёт на сбор
        run: php tests/career_verify_test.php

      - name: Один и тот же отклик не превращается в два
        run: php tests/ingest_dedupe_test.php

      - name: Отклик на смену меняет его сторона, а отказ доходит до человека
        run: php tests/like_authz_test.php

      - name: Объектные права чата, рейтинга и постоянного отклика
        run: php tests/db_object_authz_test.php

      - name: Писать человеку можно только тому, с кем есть связь
        run: php tests/notify_authz_test.php

      - name: Чужие данные на чтение не отдаются
        run: php tests/read_authz_test.php

      - name: Уведомление о сообщении собирает сервер, а не телефон
        run: php tests/message_notify_test.php

      - name: Нативный push не раскрывает данные события
        run: php tests/push_privacy_test.php

      - name: Новое обращение поддержки звонит только владельцу
        run: php tests/support_owner_notify_test.php

      - name: Мэтч и итог смены извещает сервер
        run: php tests/match_outcome_notify_test.php

      - name: Счётчики по вакансиям — только по своим
        run: php tests/stats_scope_test.php

      - name: Уведомление доходит и до браузера
        run: php tests/web_push_test.php

      - name: Разрыв воронки — ответы на отклики
        run: php tests/funnel_test.php

      - name: Главная воронка — выходы и повторные смены
        run: php tests/shift_funnel_test.php

      - name: Воронка ленты объясняет нулевые отклики
        run: php tests/feed_funnel_test.php

      - name: Анонимность отзывов о чужом профиле
        run: php tests/ratings_privacy_test.php


      - name: Обрыв связи не выдаётся за пустоту
        run: php tests/offline_states_test.php

      # Три сторожа жестов лежали в tests/, но ни один не был подключён: они
      # были зелёными и никогда не запускались. Поломка проводки жеста не
      # видна ни typecheck, ни на снимках экрана — только настоящим касанием.
      - name: Карточка в ленте листается пальцем, а не только колесом
        run: php tests/card_scroll_test.php

      - name: Свайп-удаление переписки отпускает прокрутку
        run: php tests/chats_swipe_test.php

      - name: Свайп не тратит энергию впустую
        run: php tests/swipe_energy_test.php

      - name: Service worker and infrastructure syntax
        run: |
          node --check public/sw.js
          bash -n infra/bootstrap.sh
          find infra -maxdepth 1 -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 tests/referral_chain_test.py
          python3 tests/referral_data_policy_test.py
          python3 tests/resume_data_policy_test.py
          python3 tests/user_id_contract_test.py
          python3 tests/seo_infra_test.py
          python3 tests/sitemap_invalidation_test.py
          python3 tests/deploy_migration_order_test.py
          python3 tests/career_full_catalog_test.py
          python3 tests/career_discover_run_test.py
          python3 tests/deploy_webhook_order_test.py
          python3 tests/chat_match_refresh_test.py
          python3 tests/network_action_truth_test.py
          python3 tests/perm_app_atomicity_test.py
          python3 tests/shift_match_atomicity_test.py
          python3 tests/health_endpoint_test.py
          python3 tests/telegram_link_metrics_test.py
          python3 tests/tg_poll_stuck_test.py
          pip install quickjs
          python3 -m py_compile jupiter/network_runtime.py jupiter/script_runtime.py jupiter/site_compat.py jupiter/validation.py jupiter/spa_payload.py jupiter/submission.py jupiter/sber.py jupiter/candidate.py jupiter/handoff.py jupiter/tasks.py jupiter/remote_tasks.py jupiter/run_worker.py jupiter/policy.py jupiter/engine.py jupiter/js_engine.py jupiter/agent.py jupiter/worker.py jupiter/test_server.py jupiter/recon.py
          (cd jupiter && python3 test_form_semantics.py)
          (cd jupiter && python3 test_spa_payload.py)
          (cd jupiter && python3 test_submission.py)
          (cd jupiter && python3 test_candidate.py)
          (cd jupiter && python3 test_handoff.py)
          (cd jupiter && python3 test_tasks.py)
          (cd jupiter && python3 test_remote_tasks.py)
          (cd jupiter && python3 test_run_worker.py)
          (cd jupiter && python3 test_mail_sync.py)
          (cd jupiter && python3 test_sber.py)
          (cd jupiter && python3 test_policy.py)
          (cd jupiter && python3 test_e2e.py)
          (cd jupiter && python3 test_recon.py)
          (cd jupiter && python3 test_js_engine.py)
          python3 tests/jupiter_private_lab_infra_test.py
          bash tests/nginx_config_test.sh

      - name: Web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          EXPO_PUBLIC_DASHBOARD_URL: https://example.invalid
        run: npx expo export --platform web --max-workers 2

      - name: Verify complete app shell
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ('src', 'href'):
                      value = values.get(key, '')
                      if value.startswith('/_expo/static/') or value.startswith('/assets/'):
                          self.urls.append(urlparse(value).path.lstrip('/'))

          root = Path('dist')
          html = (root / 'index.html').read_text()
          parser = Assets()
          parser.feed(html)
          missing = [url for url in parser.urls if not (root / url).is_file()]
          if not parser.urls:
              raise SystemExit('index.html has no app assets')
          if missing:
              raise SystemExit('missing app assets: ' + ', '.join(missing))
          print(f'complete shell: {len(parser.urls)} referenced assets')
          PY

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          ADMIN_API_URL: https://example.invalid/api/admin.php
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          ADMIN_API_TOKEN: ci-placeholder
          VAPID_PUBLIC_KEY: ci-placeholder
          VAPID_PRIVATE_KEY: ci-placeholder
          VAPID_SUBJECT: mailto:ci@example.invalid
        run: npm run build
