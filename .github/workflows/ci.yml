name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PHP syntax
        run: find php-proxy -name '*.php' -print0 | xargs -0 -n1 php -l


      - name: Страница вакансии отдаёт содержимое и разметку
        run: php tests/vacancy_page_test.php

      - name: Сводные страницы считают, а не выдумывают
        run: php tests/landing_page_test.php

      - name: Карта сайта не собирается заново на каждый запрос
        run: php tests/sitemap_cache_test.php

      - name: Приглашение платит за выход на смену, а не за отклик
        run: php tests/referral_test.php

      - name: Смену закрывает её сторона, а не любой вошедший
        run: php tests/shift_authz_test.php

      - name: Объявление в группу доходит, а отказ виден
        run: php tests/group_post_test.php

      - name: Согласие на обработку данных пишется и его пропажу видно
        run: php tests/consent_test.php

      - name: Решение по отклику принимает владелец вакансии и оно доходит
        run: php tests/perm_app_test.php

      - name: Отклик на смену меняет его сторона, а отказ доходит до человека
        run: php tests/like_authz_test.php

      - name: Объектные права чата, рейтинга и постоянного отклика
        run: php tests/db_object_authz_test.php

      - name: Писать человеку можно только тому, с кем есть связь
        run: php tests/notify_authz_test.php

      - name: Чужие данные на чтение не отдаются
        run: php tests/read_authz_test.php

      - name: Уведомление о сообщении собирает сервер, а не телефон
        run: php tests/message_notify_test.php

      - name: Нативный push не раскрывает данные события
        run: php tests/push_privacy_test.php

      - name: Новое обращение поддержки звонит только владельцу
        run: php tests/support_owner_notify_test.php

      - name: Мэтч и итог смены извещает сервер
        run: php tests/match_outcome_notify_test.php

      - name: Счётчики по вакансиям — только по своим
        run: php tests/stats_scope_test.php

      - name: Уведомление доходит и до браузера
        run: php tests/web_push_test.php

      - name: Разрыв воронки — ответы на отклики
        run: php tests/funnel_test.php

      - name: Главная воронка — выходы и повторные смены
        run: php tests/shift_funnel_test.php

      - name: Воронка ленты объясняет нулевые отклики
        run: php tests/feed_funnel_test.php

      - name: Анонимность отзывов о чужом профиле
        run: php tests/ratings_privacy_test.php

      - name: Плашка отзывчивости доходит до свайпа
        run: php tests/reply_badge_test.php

      - name: Обрыв связи не выдаётся за пустоту
        run: php tests/offline_states_test.php

      - name: Service worker and infrastructure syntax
        run: |
          node --check public/sw.js
          bash -n infra/bootstrap.sh
          find infra -maxdepth 1 -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 tests/referral_chain_test.py
          python3 tests/referral_data_policy_test.py
          python3 tests/resume_data_policy_test.py
          python3 tests/user_id_contract_test.py
          python3 tests/seo_infra_test.py
          python3 tests/sitemap_invalidation_test.py
          python3 tests/deploy_migration_order_test.py
          python3 tests/deploy_webhook_order_test.py
          python3 tests/chat_match_refresh_test.py
          python3 tests/network_action_truth_test.py
          python3 tests/perm_app_atomicity_test.py
          python3 tests/shift_match_atomicity_test.py
          python3 tests/health_endpoint_test.py
          python3 tests/telegram_link_metrics_test.py
          python3 tests/tg_poll_stuck_test.py
          python3 -m py_compile jupiter/engine.py jupiter/agent.py jupiter/test_server.py
          (cd jupiter && python3 test_e2e.py)
          python3 tests/jupiter_private_lab_infra_test.py
          bash tests/nginx_config_test.sh

      - name: Web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          EXPO_PUBLIC_DASHBOARD_URL: https://example.invalid
        run: npx expo export --platform web --max-workers 2

      - name: Verify complete app shell
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ('src', 'href'):
                      value = values.get(key, '')
                      if value.startswith('/_expo/static/') or value.startswith('/assets/'):
                          self.urls.append(urlparse(value).path.lstrip('/'))

          root = Path('dist')
          html = (root / 'index.html').read_text()
          parser = Assets()
          parser.feed(html)
          missing = [url for url in parser.urls if not (root / url).is_file()]
          if not parser.urls:
              raise SystemExit('index.html has no app assets')
          if missing:
              raise SystemExit('missing app assets: ' + ', '.join(missing))
          print(f'complete shell: {len(parser.urls)} referenced assets')
          PY

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          ADMIN_API_URL: https://example.invalid/api/admin.php
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          ADMIN_API_TOKEN: ci-placeholder
          VAPID_PUBLIC_KEY: ci-placeholder
          VAPID_PRIVATE_KEY: ci-placeholder
          VAPID_SUBJECT: mailto:ci@example.invalid
        run: npm run build
