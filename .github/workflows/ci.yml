name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App, tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PHP syntax
        run: find php-proxy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Partner gateway state machine
        run: php tests/partner_core_test.php
      - name: Isolated partner sandbox flow
        run: php tests/partner_sandbox_e2e_test.php

      - name: Страница вакансии отдаёт содержимое и разметку
        run: php tests/vacancy_page_test.php

      - name: Сводные страницы считают, а не выдумывают
        run: php tests/landing_page_test.php

      - name: Смерть одного источника вакансий видна в отчёте
        run: php tests/ext_health_test.php

      - name: Карьерные страницы работодателей разбираются
        run: php tests/career_feed_test.php

      - name: Service worker and infrastructure syntax
        run: |
          node --check public/sw.js
          bash -n infra/bootstrap.sh
          find infra -maxdepth 1 -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 tests/trudvsem_infra_test.py
          python3 tests/superjob_infra_test.py
          python3 tests/headhunter_infra_test.py
          python3 tests/external_filter_count_test.py
          python3 tests/feed_contract_test.py
          python3 tests/career_infra_test.py
          python3 tests/seo_infra_test.py

      - name: Web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          EXPO_PUBLIC_API_URL: https://example.invalid
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          EXPO_PUBLIC_DASHBOARD_URL: https://example.invalid
        run: npx expo export --platform web --max-workers 2

      - name: Verify complete app shell
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ('src', 'href'):
                      value = values.get(key, '')
                      if value.startswith('/_expo/static/') or value.startswith('/assets/'):
                          self.urls.append(urlparse(value).path.lstrip('/'))

          root = Path('dist')
          html = (root / 'index.html').read_text()
          parser = Assets()
          parser.feed(html)
          missing = [url for url in parser.urls if not (root / url).is_file()]
          if not parser.urls:
              raise SystemExit('index.html has no app assets')
          if missing:
              raise SystemExit('missing app assets: ' + ', '.join(missing))
          print(f'complete shell: {len(parser.urls)} referenced assets')
          PY

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          ADMIN_API_URL: https://example.invalid/api/admin.php
          EXPO_PUBLIC_APP_SECRET: ci-placeholder
          ADMIN_API_TOKEN: ci-placeholder
          VAPID_PUBLIC_KEY: ci-placeholder
          VAPID_PRIVATE_KEY: ci-placeholder
          VAPID_SUBJECT: mailto:ci@example.invalid
        run: npm run build
