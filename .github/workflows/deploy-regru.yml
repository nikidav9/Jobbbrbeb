name: Сборка сайта и доставка на московский сервер

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

# Все прогоны пишут один и тот же release asset `web/dist.tar.gz`. Без
# сериализации быстрые последовательные push одновременно делали --clobber:
# один прогон удалял asset ровно в момент upload другого, и GitHub отвечал 404.
# Нужна только самая свежая сборка — старую безопасно отменять.
concurrency:
  group: production-web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Сборка и доставка
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Which build secrets arrived
        env:
          U: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          K: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          A: ${{ secrets.EXPO_PUBLIC_API_URL }}
          S: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
        run: |
          say() { [ -n "$2" ] && echo "$1: задан, ${#2} символов" || echo "$1: ПУСТО"; }
          say EXPO_PUBLIC_SUPABASE_URL "$U"
          say EXPO_PUBLIC_SUPABASE_ANON_KEY "$K"
          say EXPO_PUBLIC_API_URL "$A"
          say EXPO_PUBLIC_APP_SECRET "$S"
          echo "адрес бэкенда: ${U:-нет}"

      - name: Build Expo web
        run: npx expo export --platform web --max-workers 2
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          EXPO_PUBLIC_DASHBOARD_URL: https://admin.jobtoo.ru
          EXPO_PUBLIC_YANDEX_MAPS_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_KEY }}

      - name: Replace favicon
        run: cp assets/images/favicon.ico dist/favicon.ico

      - name: Verify same-origin static assets
        run: |
          if grep -R "j8a6jds2at.cdn.twcstorage.ru" dist --include='*.html'; then
            echo "Обнаружена ссылка на отключённый Timeweb CDN"
            exit 1
          fi

      # Сначала публикуем артефакт. Московский сервер забирает его сам, поэтому
      # краткий отказ deploy.php не должен отменять уже готовую веб-сборку.
      - name: Publish web build for the Moscow server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf pack && mkdir pack
          cp -a dist/. pack/
          rm -rf pack/api pack/.htaccess
          printf '{"sha":"%s","deployed_at":"%s","builder":"github-actions"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > pack/jobtoo-build.json
          tar -czf dist.tar.gz -C pack .
          ls -l dist.tar.gz
          gh release view web >/dev/null 2>&1 \
            || gh release create web --latest=false \
                 -t "Веб-сборка" \
                 -n "Собирается автоматически. Московский сервер забирает отсюда dist.tar.gz."

          # GitHub uploads endpoint иногда кратко отвечает 404/5xx после
          # clobber. Сериализация убирает нашу гонку, а ограниченный retry —
          # внешний transient. После трёх отказов deploy остаётся красным.
          published=0
          for attempt in 1 2 3; do
            if gh release upload web dist.tar.gz --clobber; then
              published=1
              break
            fi
            echo "Публикация release asset: попытка $attempt не удалась"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          [ "$published" = 1 ]

      # Секреты синхронизируем отдельно. На обычном code deploy сервер уже
      # имеет рабочий набор; временная недоступность deploy.php теперь видна,
      # но не блокирует публикацию сайта.
      - name: Deliver secrets to the Moscow server
        id: secrets_delivery
        continue-on-error: true
        env:
          JT_DEPLOY_TOKEN: ${{ secrets.JT_DEPLOY_TOKEN }}
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
          APP_SECRET_PREV: ${{ secrets.APP_SECRET_PREV }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          YANDEX_GEOCODER_KEY: ${{ secrets.YANDEX_GEOCODER_KEY }}
          YANDEX_SUGGEST_KEY: ${{ secrets.YANDEX_SUGGEST_KEY }}
          SUPERJOB_SECRET_KEY: ${{ secrets.SUPERJOB_SECRET_KEY }}
          SUPERJOB_CLIENT_ID: ${{ secrets.SUPERJOB_CLIENT_ID }}
          SUPERJOB_CLIENT_SECRET: ${{ secrets.SUPERJOB_CLIENT_SECRET }}
          HH_CLIENT_ID: ${{ secrets.HH_CLIENT_ID }}
          HH_CLIENT_SECRET: ${{ secrets.HH_CLIENT_SECRET }}
          DASHBOARD_LOGIN: ${{ secrets.DASHBOARD_LOGIN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          STUDIO_LOGIN: ${{ secrets.STUDIO_LOGIN }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_KEY: ${{ secrets.BACKUP_S3_KEY }}
          BACKUP_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET }}
        run: |
          if [ -z "$JT_DEPLOY_TOKEN" ]; then
            echo "JT_DEPLOY_TOKEN не задан — пропускаю доставку"
            exit 0
          fi
          python3 - > payload.json <<'PY'
          import json, os
          e = os.environ.get
          print(json.dumps({
              "app": {
                  "APP_SECRET": e("APP_SECRET", ""),
                  "APP_SECRET_PREV": e("APP_SECRET_PREV", ""),
                  "TG_BOT_TOKEN": e("TG_BOT_TOKEN", ""),
                  "YANDEX_GEOCODER_KEY": e("YANDEX_GEOCODER_KEY", ""),
                  "YANDEX_SUGGEST_KEY": e("YANDEX_SUGGEST_KEY", ""),
                  "SUPERJOB_SECRET_KEY": e("SUPERJOB_SECRET_KEY", ""),
                  "SUPERJOB_CLIENT_ID": e("SUPERJOB_CLIENT_ID", ""),
                  "SUPERJOB_CLIENT_SECRET": e("SUPERJOB_CLIENT_SECRET", ""),
                  "HH_CLIENT_ID": e("HH_CLIENT_ID", ""),
                  "HH_CLIENT_SECRET": e("HH_CLIENT_SECRET", ""),
              },
              "admin": {
                  "login": e("DASHBOARD_LOGIN", ""),
                  "password": e("DASHBOARD_PASSWORD", ""),
              },
              "studio": {
                  "login": e("STUDIO_LOGIN", ""),
                  "password": e("STUDIO_PASSWORD", ""),
              },
              "github": {"token": e("GH_READ_TOKEN", "")},
              "backup": {
                  "endpoint": e("BACKUP_S3_ENDPOINT", ""),
                  "bucket": e("BACKUP_S3_BUCKET", ""),
                  "key": e("BACKUP_S3_KEY", ""),
                  "secret": e("BACKUP_S3_SECRET", ""),
              },
          }))
          PY
          set +e
          code=$(curl -sS -o resp.json -w '%{http_code}' \
            --retry 2 --retry-all-errors --retry-delay 5 \
            --connect-timeout 8 --max-time 30 \
            -H "X-Deploy-Token: $JT_DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @payload.json \
            https://147.45.184.99.sslip.io/api/deploy.php)
          rc=$?
          set -e
          echo "curl=$rc ответ ${code:-000}: $(cat resp.json 2>/dev/null || true)"
          rm -f payload.json resp.json
          [ "$rc" = 0 ] && [ "$code" = "200" ]

      - name: Сказать вслух, если секреты не доставлены
        if: steps.secrets_delivery.outcome == 'failure'
        run: |
          echo "::warning title=Секреты не синхронизированы::Веб-сборка опубликована, но deploy.php временно недоступен. Рабочие секреты на сервере не удалялись; повторите workflow после восстановления связи."
          {
            echo "### Секреты не синхронизированы"
            echo
            echo "Веб-сборка опубликована и этот отказ её не отменил."
            echo "deploy.php не подтвердил обновление секретов — нужен повтор после восстановления связи."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore and verify Telegram webhook
        id: webhook
        continue-on-error: true
        env:
          APP_SECRET: ${{ secrets.EXPO_PUBLIC_APP_SECRET }}
        run: |
          if [ -z "$APP_SECRET" ]; then
            echo "EXPO_PUBLIC_APP_SECRET не задан — вебхук нельзя проверить"
            exit 1
          fi

          call_tgtool() {
            action="$1"
            output="$2"
            curl -sS --retry 6 --retry-all-errors --retry-delay 10 -m 30 \
              -H "X-App-Secret: $APP_SECRET" \
              -H 'Content-Type: application/json' \
              --data "{\"action\":\"$action\"}" \
              https://jobtoo.ru/api/tgtool.php > "$output"
          }

          call_tgtool_with_retry() {
            action="$1"
            output="$2"
            for attempt in 1 2 3; do
              call_tgtool "$action" "$output"
              if ACTION="$action" OUTPUT="$output" python3 - <<'PY'
          import json
          import os
          with open(os.environ['OUTPUT'], encoding='utf-8') as fh:
              response = json.load(fh)
          if os.environ['ACTION'] == 'setWebhook':
              response = response.get('telegram', {})
          raise SystemExit(0 if response.get('ok') else 1)
          PY
              then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "$action: попытка $attempt не удалась, повтор через 10 секунд"
                sleep 10
              fi
            done
            return 1
          }

          explain_tgtool_failure() {
            action="$1"
            output="$2"
            ACTION="$action" OUTPUT="$output" python3 - <<'PY'
          import json
          import os
          with open(os.environ['OUTPUT'], encoding='utf-8') as fh:
              response = json.load(fh)
          telegram = response.get('telegram', response)
          action = os.environ['ACTION']
          kind = telegram.get('error_kind', 'telegram')
          if kind == 'transport':
              raise SystemExit(
                  f'{action}: сервер не достучался до Telegram: '
                  f"curl errno {telegram.get('curl_errno', '?')}: "
                  f"{telegram.get('curl_error') or 'без текста'}; "
                  f"HTTP {telegram.get('http_code', 0)}"
              )
          if kind == 'invalid_response':
              raise SystemExit(
                  f'{action}: сервер получил от Telegram неразбираемый ответ: '
                  f"HTTP {telegram.get('http_code', 0)}; "
                  f"{telegram.get('json_error', 'ошибка JSON')}; "
                  f"raw={telegram.get('raw', '')!r}"
              )
          raise SystemExit(
              f'{action}: Telegram отказал: '
              f"{telegram.get('description', 'без описания')} "
              f"(HTTP {telegram.get('http_code', 0)}, "
              f"error_code={telegram.get('error_code', '?')})"
          )
          PY
          }

          call_tgtool_with_retry setWebhook webhook-set.json \
            || explain_tgtool_failure setWebhook webhook-set.json
          call_tgtool_with_retry webhookInfo webhook-info.json \
            || explain_tgtool_failure webhookInfo webhook-info.json

          python3 - <<'PY'
          import json
          with open('webhook-set.json', encoding='utf-8') as fh:
              changed = json.load(fh)
          with open('webhook-info.json', encoding='utf-8') as fh:
              current = json.load(fh)
          target = changed.get('target', '')
          if not current.get('ok'):
              raise SystemExit(f"getWebhookInfo завершился ошибкой: {current}")
          actual = current.get('result', {}).get('url', '')
          if not target or actual != target:
              raise SystemExit(f"Неверный адрес вебхука: {actual!r}, ожидался {target!r}")
          print(f"Telegram webhook активен: {actual}")
          PY
          rm -f webhook-set.json webhook-info.json

      - name: Сказать вслух, если вебхук не восстановился
        if: steps.webhook.outcome == 'failure'
        run: |
          echo "::warning title=Вебхук Telegram не восстановлен::Сайт выложен, но привязка бота не подтверждена. Вход в мини-приложение и уведомления могут не работать — проверьте связь сервера с api.telegram.org."
          {
            echo "### Вебхук Telegram не восстановлен"
            echo
            echo "Сайт выложен — этот отказ его не отменил."
            echo "Но бот несёт вход в мини-приложение и уведомления, так что привязку надо проверить."
          } >> "$GITHUB_STEP_SUMMARY"
