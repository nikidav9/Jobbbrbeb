name: Apply vacancy deletion truth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-vacancy-delete-truth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply_vacancy_delete_truth.py

      - name: Validate focused regressions
        run: |
          git diff --check
          python3 tests/network_action_truth_test.py
          python3 tests/perm_app_atomicity_test.py
          npm ci
          npm run typecheck

      - name: Commit source fixes
        run: |
          # The patcher also prepares ci.yml, but GITHUB_TOKEN is intentionally
          # not allowed to update workflow files. Keep that change out of this
          # bot commit; it is applied separately through the GitHub contents API.
          git restore -- '.github/workflows/ci.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'app/(tabs)/feed.tsx' \
            'tests/network_action_truth_test.py'
          git commit -m "fix: keep vacancy deletion truthful"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
