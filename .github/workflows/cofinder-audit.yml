name: Аудит ссылок Cofinder

# Небольшой read-only браузерный аудит конкурента. Не парсим весь сайт:
# один каталог + максимум три публичные карточки вакансий и два публичных API.
# Нужен, чтобы видеть фактическую схему source/apply URL и не гадать при
# настройке карьерных источников JobToo.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cofinder-audit.mjs'
      - '.github/workflows/cofinder-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Проверить, какие ссылки хранит Cofinder
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install pinned Chromium harness
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Lint audit script
        run: npx eslint scripts/cofinder-audit.mjs

      - name: Read-only Cofinder audit
        env:
          COFINDER_AUDIT_OUT: cofinder-audit.json
        run: node scripts/cofinder-audit.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofinder-audit-${{ github.run_id }}
          path: cofinder-audit.json
          if-no-files-found: warn
          retention-days: 14
