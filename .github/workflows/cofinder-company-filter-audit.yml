name: Аудит фильтра компаний Cofinder

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cofinder-company-filter-audit.mjs'
      - '.github/workflows/cofinder-company-filter-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Read-only API probe
        env:
          COFINDER_FILTER_OUT: cofinder-company-filter-audit.json
        run: node scripts/cofinder-company-filter-audit.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofinder-company-filter-audit-${{ github.run_id }}
          path: cofinder-company-filter-audit.json
          if-no-files-found: warn
          retention-days: 14
