name: Apply truthful notification read state

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_notification_read_truth.py
      - .github/workflows/apply-notification-read-truth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 scripts/apply_notification_read_truth.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate typecheck and focused test
        run: |
          npm run typecheck
          node --import tsx --test tests/notificationReadTruth.test.ts
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contexts/AppContext.tsx components/ui/NotifBell.tsx tests/notificationReadTruth.test.ts
          git diff --cached --exit-code && exit 0
          git commit -m 'fix: keep notification read state server-confirmed'
          git push origin HEAD:main
