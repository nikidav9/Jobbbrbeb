name: Apply visible network states

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-visible-network-states.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply_visible_network_states.py

      - name: Validate
        run: |
          git diff --check
          php tests/offline_states_test.php
          npm ci
          npm run typecheck

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/chat-room.tsx app/user-profile.tsx 'app/(tabs)/profile.tsx' tests/offline_states_test.php
          git commit -m "fix: distinguish network failures from empty screens"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
