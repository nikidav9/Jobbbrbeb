name: Apply db object authorization fixes

on:
  push:
    branches: [codex/release-candidate-2026-09-14]
    paths:
      - .github/workflows/apply-db-object-authz.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-candidate-2026-09-14
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/apply_db_object_authz.py

      - name: Validate patch
        run: |
          git diff --check
          php -l php-proxy/db.php
          php tests/db_object_authz_test.php
          php tests/perm_app_test.php
          php tests/like_authz_test.php
          php tests/read_authz_test.php

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-db-object-authz.yml scripts/apply_db_object_authz.py
          git add php-proxy/db.php tests/db_object_authz_test.php .github/workflows/ci.yml
          git commit -m "fix: bind db mutations to authenticated objects"
          git fetch origin codex/release-candidate-2026-09-14
          git rebase origin/codex/release-candidate-2026-09-14
          git push origin HEAD:codex/release-candidate-2026-09-14
