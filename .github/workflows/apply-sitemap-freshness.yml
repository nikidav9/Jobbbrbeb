name: Apply sitemap freshness fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply_sitemap_freshness.py
      - .github/workflows/apply-sitemap-freshness.yml

permissions:
  contents: write

concurrency:
  group: apply-sitemap-freshness
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply guarded patch
        run: python3 scripts/apply_sitemap_freshness.py

      - name: Validate PHP and focused contracts
        run: |
          git diff --check
          php -l php-proxy/sitemap.php
          php -l php-proxy/sitemap_cache.php
          php -l php-proxy/ingest.php
          php -l php-proxy/db.php
          php tests/sitemap_cache_test.php
          php tests/landing_page_test.php
          python3 tests/seo_infra_test.py
          python3 tests/sitemap_invalidation_test.py

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add php-proxy/sitemap.php php-proxy/ingest.php php-proxy/db.php .github/workflows/ci.yml
          git commit -m 'fix: keep sitemap aligned with live landing pages'
          git push origin HEAD:main
