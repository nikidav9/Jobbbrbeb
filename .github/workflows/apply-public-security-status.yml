name: Apply public security status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-public-security-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_public_security_status.py

      - name: Validate infrastructure guards
        run: |
          git diff --check
          bash -n infra/migrate.sh
          bash -n infra/check-site.sh
          python3 tests/deploy_migration_order_test.py
          bash tests/nginx_config_test.sh

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- infra/migrate.sh infra/check-site.sh infra/nginx-tls.conf tests/deploy_migration_order_test.py
          git commit -m "fix: expose safe production security status"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
