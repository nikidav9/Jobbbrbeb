name: Apply truthful Telegram prepare-link errors

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_telegram_prepare_truth.py'
      - '.github/workflows/apply-telegram-prepare-truth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guarded patch
        run: python3 scripts/apply_telegram_prepare_truth.py
      - name: Validate focused contract and typecheck
        run: |
          git diff --check
          php tests/offline_states_test.php
          npm ci
          npm run typecheck
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/db.ts tests/offline_states_test.php
          git commit -m 'fix: surface Telegram prepare-link failures'
          git push origin HEAD:main
