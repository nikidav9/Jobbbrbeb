name: Temporary Fibonacci vacancy card patch

on:
  push:
    branches: ["ui/fibonacci-vacancy-card"]
    paths: [".github/workflows/fibonacci-vacancy-card.yml"]

permissions:
  contents: write

jobs:
  patch-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/fibonacci-vacancy-card
          fetch-depth: 0

      - name: Apply Fibonacci grid
        run: python3 .github/scripts/fibonacci_vacancy_card_patch.py

      - name: Check patch
        run: |
          git diff --check
          git diff -- app/'(tabs)'/feed.tsx components/ui/Chip.tsx components/feature/ReplyBadge.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'(tabs)'/feed.tsx components/ui/Chip.tsx components/feature/ReplyBadge.tsx
          git commit -m "Refine vacancy card on Fibonacci grid"
          git push origin HEAD:ui/fibonacci-vacancy-card
