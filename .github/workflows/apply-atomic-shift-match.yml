name: Apply atomic shift match

# One-shot guarded source patch. Delete after a successful source commit.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-atomic-shift-match.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply_atomic_shift_match.py

      - name: Validate focused regressions
        run: |
          git diff --check
          php -l php-proxy/db.php
          python3 tests/shift_match_atomicity_test.py
          python3 tests/perm_app_atomicity_test.py
          php tests/db_object_authz_test.php
          npm ci
          npm run typecheck

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'php-proxy/db.php' 'services/db.ts'
          git commit -m "fix: make shift matching atomic"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
